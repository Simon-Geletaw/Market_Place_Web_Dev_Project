<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS ||--o{ SERVICE_REQUESTS : "posts"
  USERS ||--o{ OFFERS : "submits"
  USERS ||--o{ REVIEWS : "writes as customer"
  USERS ||--o{ REVIEWS : "receives as provider"
  USERS ||--o{ AUDIT_LOGS : "generates"
  
  SERVICE_CATEGORIES ||--o{ SERVICE_REQUESTS : "categorizes"
  
  SERVICE_REQUESTS ||--o{ OFFERS : "receives"
  SERVICE_REQUESTS ||--o| REVIEWS : "results in"
  SERVICE_REQUESTS ||--o{ STATUS_HISTORY : "tracks"
  
  USERS {
    int id PK
    varchar email UK
    varchar password_hash
    enum role "customer, provider, admin"
    varchar name
    varchar phone
    varchar location "sub-city"
    timestamp created_at
  }
  
  SERVICE_CATEGORIES {
    int id PK
    varchar name UK
    text description
  }
  
  SERVICE_REQUESTS {
    int id PK
    int customer_id FK
    int category_id FK
    text description
    date preferred_date
    enum status "Requested, Negotiating, Assigned, Completed, Reviewed"
    varchar location
    timestamp created_at
    timestamp updated_at
  }
  
  OFFERS {
    int id PK
    int request_id FK
    int provider_id FK
    decimal price
    text message
    enum status "pending, accepted, rejected, countered"
    timestamp created_at
  }
  
  REVIEWS {
    int id PK
    int request_id FK
    int customer_id FK
    int provider_id FK
    int rating "1-5"
    text comment
    timestamp created_at
  }
  
  AUDIT_LOGS {
    int id PK
    int user_id FK
    varchar action
    text details
    timestamp created_at
  }
  
  STATUS_HISTORY {
    int id PK
    int request_id FK
    varchar old_status
    varchar new_status
    int duration_seconds
    timestamp changed_at
  }
`);
document.getElementById('erd').innerHTML = svg;

// Round entity box corners
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

// Strip borders from attribute rows
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
