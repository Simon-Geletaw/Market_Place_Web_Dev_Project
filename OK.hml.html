<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OK</title>
    <script>
        async function fetchHealthStatus() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                document.getElementById('health-status').innerText = `Service: ${data.data.service}, PHP Version: ${data.data.php_version}`;
            } catch (error) {
                document.getElementById('health-status').innerText = 'Failed to fetch health status.';
            }
        }

        window.onload = fetchHealthStatus;
    </script>
</head>
<body>
    <h1>OK</h1>
    <p>PHP Backend is working. Endpoint: <a href="backend/public/index.php">/ok</a></p>
    <p id="health-status">Loading health status...</p>
</body>
</html>
