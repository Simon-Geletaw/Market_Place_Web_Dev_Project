<!DOCTYPE html>
<html lang="en" data-role="provider">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Browse open service requests, manage your offers, and track assigned jobs.">
  <title>Provider Dashboard — ServiceLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <script src="../../core/guard.js"></script>
</head>
<body>

<header id="app-header"></header>

<div class="app-shell">
  <aside id="app-sidebar"></aside>

  <main class="app-content">
    <div class="page-header">
      <div>
        <div class="page-header__title" id="welcomeMsg">Provider Dashboard</div>
        <div class="page-header__subtitle">Find jobs, submit offers, and grow your business</div>
      </div>
      <a href="../marketplace.html" class="btn btn--primary">🔍 Browse Marketplace</a>
    </div>

    <!-- Stat Cards -->
    <div class="grid-4 mb-lg">
      <div class="stat-card">
        <div class="stat-card__icon" style="background:#e8f4ff">📤</div>
        <div class="stat-card__value" id="cntPending">—</div>
        <div class="stat-card__label">Active Offers</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon" style="background:#e8f5eb">🔨</div>
        <div class="stat-card__value" id="cntAssigned">—</div>
        <div class="stat-card__label">Assigned Jobs</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon" style="background:#e0faf4">🎉</div>
        <div class="stat-card__value" id="cntCompleted">—</div>
        <div class="stat-card__label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon" style="background:#fff4e0">⭐</div>
        <div class="stat-card__value" id="ratingAvg">—</div>
        <div class="stat-card__label">Your Rating</div>
      </div>
    </div>

    <!-- Assigned Jobs -->
    <div class="mb-lg">
      <h3 class="section-title">Active Assigned Jobs</h3>
      <div id="assignedList">
        <div class="empty-state"><div class="spinner spinner--dark"></div><p>Loading...</p></div>
      </div>
    </div>

    <!-- My Offers -->
    <div>
      <h3 class="section-title">Recent Offers</h3>
      <div id="offersList">
        <div class="empty-state"><div class="spinner spinner--dark"></div><p>Loading...</p></div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
import Api    from '../../core/api.js';
import Auth   from '../../core/auth.js';
import Toast  from '../../core/toast.js';
import Layout from '../../core/layout.js';

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

const OFFER_BADGE = {
  Pending:  'badge--negotiating',
  Accepted: 'badge--assigned',
  Rejected: 'badge--danger',
  Countered: 'badge--requested',
};

async function loadDashboard() {
  try {
    const [dashRes, offersRes] = await Promise.all([
      Api.get('/provider/dashboard'),
      Api.get('/offers'),
    ]);

    const data   = dashRes.data  || {};
    const offers = offersRes.data || [];

    // Stats
    document.getElementById('cntPending').textContent   = offers.filter(o => o.status === 'Pending').length;
    document.getElementById('cntAssigned').textContent  = data.assigned_count  ?? '0';
    document.getElementById('cntCompleted').textContent = data.completed_count ?? '0';

    const user = Auth.getUser();
    document.getElementById('ratingAvg').textContent =
      user?.rating_average ? parseFloat(user.rating_average).toFixed(1) + ' ★' : 'New';

    // Assigned jobs
    const assignedList = document.getElementById('assignedList');
    const recent = data.recent_assigned || [];
    if (!recent.length) {
      assignedList.innerHTML = `<div class="empty-state">
        <div class="empty-state__icon">🔨</div>
        <p class="empty-state__text">No active assigned jobs. <a href="../marketplace.html">Browse the marketplace</a>.</p>
      </div>`;
    } else {
      assignedList.innerHTML = recent.map(r => `
        <div class="request-card mb-md">
          <div class="request-card__header">
            <div>
              <div class="request-card__title">${esc((r.description||'').substring(0,60))}...</div>
              <div class="request-card__meta">
                <span>📍 ${esc(r.location || '—')}</span>
                <span>🗂 ${esc(r.category_name || '—')}</span>
                <span>📅 ${r.preferred_date || 'Flexible'}</span>
              </div>
            </div>
            <span class="badge badge--assigned">Assigned</span>
          </div>
          <div class="request-card__footer">
            <div class="request-card__actions">
              <a href="../request-detail-provider.html?id=${r.id}" class="btn btn--primary btn--sm">View Job</a>
              <button class="btn btn--success btn--sm" onclick="markComplete('${r.id}', this)">✓ Mark Complete</button>
            </div>
          </div>
        </div>`).join('');
    }

    // Offers
    const offersList = document.getElementById('offersList');
    if (!offers.length) {
      offersList.innerHTML = `<div class="empty-state">
        <p class="empty-state__text">No offers yet. <a href="../marketplace.html">Browse the marketplace</a> to submit your first offer.</p>
      </div>`;
    } else {
      offersList.innerHTML = offers.slice(0, 5).map(o => `
        <div class="request-card mb-sm">
          <div class="request-card__header">
            <div>
              <div class="request-card__title">Offer #${esc(o.id?.substring(0,8))}...</div>
              <div class="request-card__meta">
                <span>💰 ETB ${parseFloat(o.price||0).toLocaleString()}</span>
                <span>📅 ${o.created_at ? new Date(o.created_at).toLocaleDateString() : '—'}</span>
              </div>
            </div>
            <span class="badge ${OFFER_BADGE[o.status]||''}">${esc(o.status)}</span>
          </div>
          ${o.message ? `<p class="request-card__desc">${esc(o.message)}</p>` : ''}
        </div>`).join('');
    }

  } catch (err) {
    Toast.error(err.message || 'Failed to load dashboard.');
  }
}

window.markComplete = async function(requestId, btn) {
  if (!confirm('Mark this job as completed?')) return;
  btn.disabled = true;
  btn.textContent = 'Updating...';
  try {
    await Api.post(`/requests/${requestId}/complete`, {});
    Toast.success('Job marked as complete!');
    loadDashboard();
  } catch (err) {
    Toast.error(err.message || 'Failed to mark complete.');
    btn.disabled = false;
    btn.textContent = '✓ Mark Complete';
  }
};

async function init() {
  const ok = await Auth.load();
  if (!ok || !Auth.requireAuth(['provider'])) return;

  Layout.renderShell('provider', 'dashboard', 'dashboard');
  document.getElementById('welcomeMsg').textContent =
    `Welcome, ${Auth.user?.name || 'Provider'}! 👷`;

  await loadDashboard();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
