<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Provider Dashboard — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <script src="../../core/guard.js"></script>
</head>
<body>

<header id="app-header"></header>

<div class="app-shell">
  <aside id="app-sidebar"></aside>

  <main class="app-content">
    <div class="page-header">
      <div>
        <div class="page-header__title" id="welcomeMsg">Provider Dashboard</div>
        <div class="page-header__subtitle" id="ratingLine">Find and complete service jobs</div>
      </div>
      <a href="../marketplace.html" class="btn btn--primary">Browse Available Jobs</a>
    </div>

    <!-- Stat Cards -->
    <div class="grid-4 mb-lg">
      <div class="stat-card stat-card--negotiating">
        <div class="stat-card__icon" style="background:#fff4e0">📤</div>
        <div class="stat-card__value" id="cntPending">—</div>
        <div class="stat-card__label">Pending Offers</div>
      </div>
      <div class="stat-card stat-card--assigned">
        <div class="stat-card__icon" style="background:#e8f5eb">✅</div>
        <div class="stat-card__value" id="cntAccepted">—</div>
        <div class="stat-card__label">Accepted Offers</div>
      </div>
      <div class="stat-card stat-card--completed">
        <div class="stat-card__icon" style="background:#e0faf4">🎉</div>
        <div class="stat-card__value" id="cntCompleted">—</div>
        <div class="stat-card__label">Completed Jobs</div>
      </div>
      <div class="stat-card stat-card--reviewed" style="border-left-color:var(--status-reviewed)">
        <div class="stat-card__icon" style="background:#eef0ff">⭐</div>
        <div class="stat-card__value" id="avgRating">—</div>
        <div class="stat-card__label">Avg Rating</div>
      </div>
    </div>

    <!-- Recent Offers -->
    <h3 style="margin-bottom:var(--space-md)">My Recent Offers</h3>
    <div id="offersList"></div>

    <!-- Nearby Open Requests -->
    <h3 style="margin:var(--space-xl) 0 var(--space-md)">Open Requests Near You</h3>
    <div class="filter-bar">
      <select class="form-select" id="catFilter">
        <option value="">All Categories</option>
        <option>Electrician</option><option>Plumber</option><option>Carpenter</option>
        <option>Painter</option><option>Cleaner</option><option>General Handyman</option>
      </select>
      <button class="btn btn--primary btn--sm" id="filterNearbyBtn">Filter</button>
    </div>
    <div id="nearbyList"></div>
  </main>
</div>

<script type="module">
import Api from '../../core/api.js';
import Auth from '../../core/auth.js';
import Toast from '../../core/toast.js';
import Layout from '../../core/layout.js';

const BADGE = { pending:'badge--pending', accepted:'badge--accepted', rejected:'badge--rejected', countered:'badge--countered' };
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

async function loadOffers() {
  const el = document.getElementById('offersList');
  el.innerHTML = '<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  try {
    const res = await Api.get('/offers');
    const offers = (res.data||[]).slice(0,5);
    document.getElementById('cntPending').textContent  = (res.data||[]).filter(o=>o.status==='pending').length;
    document.getElementById('cntAccepted').textContent = (res.data||[]).filter(o=>o.status==='accepted').length;
    document.getElementById('cntCompleted').textContent= (res.data||[]).filter(o=>o.status==='accepted'&&o.request_status==='Completed').length;
    if (!offers.length) { el.innerHTML='<div class="empty-state"><p class="text-muted">No offers submitted yet.</p></div>'; return; }
    el.innerHTML = `<div class="table-wrap"><table class="table"><thead><tr><th>Request</th><th>Price</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>
      ${offers.map(o=>`<tr>
        <td><a href="../request-detail-provider.html?id=${o.request_id}">${esc(o.request_title||'Request')}</a></td>
        <td><strong>${parseFloat(o.price_offered).toLocaleString()} ETB</strong></td>
        <td><span class="badge ${BADGE[o.status]||''}">${o.status}</span></td>
        <td class="text-muted text-sm">${new Date(o.created_at).toLocaleDateString()}</td>
        <td><a href="../request-detail-provider.html?id=${o.request_id}" class="btn btn--secondary btn--sm">View</a></td>
      </tr>`).join('')}
    </tbody></table></div>
    <p style="margin-top:var(--space-sm)"><a href="../provider/my-offers.html">View all offers →</a></p>`;
  } catch { el.innerHTML='<p class="text-muted">Could not load offers.</p>'; }
}

async function loadNearby() {
  const el = document.getElementById('nearbyList');
  const cat = document.getElementById('catFilter').value;
  el.innerHTML = '<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  try {
    const res = await Api.get(`/marketplace/requests?category=${cat}`);
    const items = (res.data||[]).slice(0,6);
    if (!items.length) { el.innerHTML='<div class="empty-state"><p class="text-muted">No open requests found.</p></div>'; return; }
    el.innerHTML = '<div class="grid-2">' + items.map(r=>`
      <div class="request-card">
        <div class="request-card__header">
          <div>
            <div class="request-card__title">${esc(r.title)}</div>
            <div class="request-card__meta"><span>📍 ${esc(r.location)}</span><span>🗂 ${esc(r.category_name||r.category)}</span></div>
          </div>
          <span class="badge badge--requested">${r.status}</span>
        </div>
        <p class="request-card__desc">${esc(r.description)}</p>
        <div class="request-card__footer">
          ${r.budget ? `<span class="text-sm text-muted">Budget: ${r.budget} ETB</span>` : '<span></span>'}
          <a href="../request-detail-provider.html?id=${r.id}" class="btn btn--primary btn--sm">View & Offer</a>
        </div>
      </div>`).join('') + '</div>';
  } catch { el.innerHTML='<p class="text-muted">Could not load requests.</p>'; }
}

async function init() {
  await Auth.load();
  if (!Auth.requireAuth()) return;
  Layout.renderShell('provider', 'dashboard', 'dashboard');
  
  document.getElementById('welcomeMsg').textContent = `Welcome, ${Auth.user.first_name || Auth.user.name || 'User'}`;
  if (Auth.user.rating_average) {
    document.getElementById('ratingLine').textContent = `Rating: ${parseFloat(Auth.user.rating_average).toFixed(1)} ⭐  ${Auth.user.is_verified ? '· ✓ Verified' : '· Pending Verification'}`;
    document.getElementById('avgRating').textContent = parseFloat(Auth.user.rating_average).toFixed(1);
  }
  
  document.getElementById('filterNearbyBtn').addEventListener('click', loadNearby);
  
  loadOffers();
  loadNearby();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
