<!DOCTYPE html>
<html lang="en" data-role="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Manage your service requests, track offers, and connect with providers.">
  <title>Customer Dashboard — ServiceLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    /* ── Customer Dashboard Specific ── */
    .welcome-banner {
      background: linear-gradient(135deg, #0052A3 0%, #0077E6 100%);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-lg);
      margin-bottom: var(--space-xl);
      position: relative;
      overflow: hidden;
    }
    .welcome-banner::after {
      content: '';
      position: absolute;
      right: -40px; top: -40px;
      width: 180px; height: 180px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .welcome-banner__content { position: relative; z-index: 1; }
    .welcome-banner__title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .welcome-banner__subtitle { font-size: 14px; opacity: 0.85; }
    .welcome-banner__actions { position: relative; z-index: 1; flex-shrink: 0; }
    .welcome-banner__actions .btn {
      background: rgba(255,255,255,0.15); color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .welcome-banner__actions .btn:hover { background: rgba(255,255,255,0.25); color: #fff; }

    .stat-card__icon-wrap {
      width: 44px; height: 44px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: var(--space-sm);
    }
    .stat-card__icon-wrap svg { width: 22px; height: 22px; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: var(--space-md);
    }
    .section-header__title {
      font-size: 16px; font-weight: 700;
      display: flex; align-items: center; gap: var(--space-sm);
    }
    .section-header__title svg { opacity: 0.5; }

    .job-card {
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: var(--space-md);
      transition: box-shadow var(--transition), border-color var(--transition);
    }
    .job-card:hover { box-shadow: var(--shadow-hover); border-color: #ccc; }
    .job-card__top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: var(--space-md); margin-bottom: 10px;
    }
    .job-card__title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    .job-card__meta {
      display: flex; align-items: center; gap: var(--space-lg);
      font-size: 12px; color: var(--color-text-secondary);
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .job-card__meta-item { display: inline-flex; align-items: center; gap: 4px; }
    .job-card__meta-item svg { width: 14px; height: 14px; opacity: 0.5; }
    .job-card__desc {
      font-size: 13px; color: var(--color-text-secondary); line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .job-card__actions { display: flex; gap: var(--space-sm); }

    .empty-card {
      background: var(--color-bg-white);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-xl) var(--space-lg);
      text-align: center;
    }
    .empty-card__icon { width: 48px; height: 48px; margin: 0 auto var(--space-md); color: var(--color-text-muted); opacity: 0.3; }
    .empty-card__text { color: var(--color-text-secondary); font-size: 14px; line-height: 1.6; }
    .empty-card__text a { font-weight: 600; }

    @media (max-width: 768px) {
      .welcome-banner { flex-direction: column; align-items: flex-start; padding: 20px 24px; }
    }
  </style>
  <script src="../../core/guard.js"></script>
</head>
<body>

<header id="app-header"></header>

<div class="app-shell">
  <aside id="app-sidebar"></aside>

  <main class="app-content">

    <!-- Welcome Banner -->
    <div class="welcome-banner">
      <div class="welcome-banner__content">
        <div class="welcome-banner__title" id="welcomeMsg">My Dashboard</div>
        <div class="welcome-banner__subtitle">Track your service requests and offers</div>
      </div>
      <div class="welcome-banner__actions">
        <button class="btn" id="openCreateTopBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Post New Request
        </button>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="grid-4 mb-lg" id="statCards">
      <div class="stat-card stat-card--requested" data-filter="Requested">
        <div class="stat-card__icon-wrap" style="background:#e8f4ff;color:#0066CC">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <div class="stat-card__value" id="cntRequested">&mdash;</div>
        <div class="stat-card__label">Requested</div>
      </div>
      <div class="stat-card stat-card--negotiating" data-filter="Negotiating">
        <div class="stat-card__icon-wrap" style="background:#fff4e0;color:#b36a00">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </div>
        <div class="stat-card__value" id="cntNegotiating">&mdash;</div>
        <div class="stat-card__label">Negotiating</div>
      </div>
      <div class="stat-card stat-card--assigned" data-filter="Assigned">
        <div class="stat-card__icon-wrap" style="background:#e8f5eb;color:#1a7a32">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="stat-card__value" id="cntAssigned">&mdash;</div>
        <div class="stat-card__label">Assigned</div>
      </div>
      <div class="stat-card stat-card--completed" data-filter="Completed">
        <div class="stat-card__icon-wrap" style="background:#e0faf4;color:#0f7a5a">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
        <div class="stat-card__value" id="cntCompleted">&mdash;</div>
        <div class="stat-card__label">Completed</div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <select class="form-select" id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Requested">Requested</option>
        <option value="Negotiating">Negotiating</option>
        <option value="Assigned">Assigned</option>
        <option value="Completed">Completed</option>
        <option value="Reviewed">Reviewed</option>
      </select>
      <select class="form-select" id="sortFilter">
        <option value="desc">Newest First</option>
        <option value="asc">Oldest First</option>
      </select>
      <button class="btn btn--secondary btn--sm" id="refreshBtn">Refresh</button>
    </div>

    <!-- Requests List -->
    <div id="requestsList"></div>
  </main>
</div>

<!-- Create Request Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitleDashboardCreate">
    <div class="modal__header">
      <h2 class="modal__title" id="modalTitleDashboardCreate">Post a New Service Request</h2>
      <button class="modal__close" id="closeCreateTopBtn" aria-label="Close new request modal">&times;</button>
    </div>
    <div class="modal__body">
      <form id="createForm" novalidate>
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select class="form-select" id="crCategory">
            <option value="">Loading categories...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Title</label>
          <input class="form-input" type="text" id="crTitle" placeholder="Brief title for your request (optional)" maxlength="160">
        </div>
        <div class="form-group">
          <label class="form-label">Description *</label>
          <textarea class="form-textarea" id="crDesc" rows="4" placeholder="Describe the problem in detail (min 10 characters)..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Budget (ETB)</label>
          <input class="form-input" type="number" id="crBudget" placeholder="Optional estimated budget" min="0" step="0.01">
        </div>
        <div id="createFormError" class="form-error" style="display:none"></div>
      </form>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" id="closeCreateBtn" type="button">Cancel</button>
      <button class="btn btn--primary" id="createBtn" type="button">Post Request</button>
    </div>
  </div>
</div>

<script type="module">
import Api   from '../../core/api.js';
import Auth  from '../../core/auth.js';
import Toast from '../../core/toast.js';
import Layout from '../../core/layout.js';

const BADGE = {
  Requested: 'badge--requested', Negotiating: 'badge--negotiating',
  Assigned: 'badge--assigned',   Completed: 'badge--completed',
  Reviewed: 'badge--reviewed'
};

/* ── Inline SVG icons ── */
const IC = {
  pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  tag: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
  cal: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  offers: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
  empty: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
};

// -----------------------------------------------------------------------
// Load dynamic categories from API
// -----------------------------------------------------------------------
async function loadCategories() {
  try {
    const res  = await Api.get('/categories');
    const cats = res.data || [];
    const sel  = document.getElementById('crCategory');
    // Use category ID as value — backend checks category_id first
    sel.innerHTML = '<option value="">Select category...</option>' +
      cats.map(c => `<option value="${esc(c.id)}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  } catch {
    // Fallback to hardcoded list (name-based — backend falls back to findByName)
    document.getElementById('crCategory').innerHTML = `
      <option value="">Select category...</option>
      <option value="Electrician">Electrician</option>
      <option value="Plumber">Plumber</option>
      <option value="Carpenter">Carpenter</option>
      <option value="Painter">Painter</option>
      <option value="Cleaner">Cleaner</option>
      <option value="General Handyman">General Handyman</option>`;
  }
}

// -----------------------------------------------------------------------
// Load and render requests
// -----------------------------------------------------------------------
async function loadRequests() {
  const status = document.getElementById('statusFilter').value;
  const sort   = document.getElementById('sortFilter').value;
  const list   = document.getElementById('requestsList');
  list.innerHTML = '<div class="empty-card"><div class="spinner spinner--dark" style="margin:0 auto"></div><p class="empty-card__text mt-sm">Loading your requests...</p></div>';
  try {
    const res      = await Api.get(`/requests?status=${encodeURIComponent(status)}&sort=${sort}`);
    const requests = Array.isArray(res.data) ? res.data : [];
    updateStats(requests);
    if (!requests.length) {
      list.innerHTML = `<div class="empty-card">
        <div class="empty-card__icon">${IC.empty}</div>
        <div style="font-size:16px;font-weight:600;margin-bottom:8px">No requests found</div>
        <p class="empty-card__text">Post your first service request to get started.</p>
        <button class="btn btn--primary mt-md" id="emptyCreateBtn">Post a Request</button>
      </div>`;
      document.getElementById('emptyCreateBtn')?.addEventListener('click', openCreateModal);
      return;
    }
    list.innerHTML = requests.map(renderCard).join('');
  } catch (err) {
    list.innerHTML = `<div class="empty-card"><p class="empty-card__text">${esc(err.message || 'Could not load requests.')}</p></div>`;
  }
}

function updateStats(requests) {
  const count = s => requests.filter(r => r.status === s).length;
  document.getElementById('cntRequested').textContent  = count('Requested');
  document.getElementById('cntNegotiating').textContent = count('Negotiating');
  document.getElementById('cntAssigned').textContent   = count('Assigned');
  document.getElementById('cntCompleted').textContent  = count('Completed');
}

function renderCard(r) {
  const heading = r.title || ((r.description || '').length > 60
    ? r.description.substring(0, 60) + '...'
    : (r.description || 'Untitled'));

  const actionMap = {
    Negotiating: `<a href="../request-detail.html?id=${r.id}" class="btn btn--ghost btn--sm">Manage Offers</a>`,
    Assigned:    `<a href="../request-detail.html?id=${r.id}" class="btn btn--ghost btn--sm">Track Progress</a>`,
    Completed:   `<a href="../request-detail.html?id=${r.id}" class="btn btn--secondary btn--sm">Leave Review</a>`,
  };

  return `
  <div class="job-card">
    <div class="job-card__top">
      <div class="job-card__title">${esc(heading)}</div>
      <span class="badge ${BADGE[r.status] || ''}">${esc(r.status)}</span>
    </div>
    <div class="job-card__meta">
      <span class="job-card__meta-item">${IC.pin} ${esc(r.location || 'N/A')}</span>
      <span class="job-card__meta-item">${IC.tag} ${esc(r.category_name || r.category || 'N/A')}</span>
      <span class="job-card__meta-item">${IC.cal} ${r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'N/A'}</span>
      ${r.offer_count > 0 ? `<span class="job-card__meta-item">${IC.offers} ${r.offer_count} offer${r.offer_count > 1 ? 's' : ''}</span>` : ''}
    </div>
    <p class="job-card__desc">${esc(r.description || '')}</p>
    <div class="job-card__actions">
      <a href="../request-detail.html?id=${r.id}" class="btn btn--primary btn--sm">View Details</a>
      ${actionMap[r.status] || ''}
    </div>
  </div>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// -----------------------------------------------------------------------
// Modal controls
// -----------------------------------------------------------------------
function openCreateModal()  { document.getElementById('createModal').classList.add('open'); }
function closeCreateModal() { document.getElementById('createModal').classList.remove('open'); }
function filterRequests(s)  { document.getElementById('statusFilter').value = s; loadRequests(); }

// -----------------------------------------------------------------------
// Submit new request — aligned with backend requirements
// -----------------------------------------------------------------------
async function submitRequest() {
  const btn   = document.getElementById('createBtn');
  const errEl = document.getElementById('createFormError');
  const categorySelect = document.getElementById('crCategory');
  const categoryValue  = categorySelect.value;

  // Determine if value is a UUID (category_id) or a name (fallback)
  const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(categoryValue);

  const body = {
    description: document.getElementById('crDesc').value.trim()
  };

  // Add title if provided
  const title = document.getElementById('crTitle').value.trim();
  if (title) body.title = title;

  // Add budget if provided
  const budget = document.getElementById('crBudget').value;
  if (budget !== '' && budget !== null) body.budget = parseFloat(budget);

  // Send category_id (preferred) or category name (fallback)
  if (isUuid) {
    body.category_id = categoryValue;
  } else {
    body.category = categoryValue;
  }

  // Client-side validation
  const errs = [];
  if (!categoryValue) errs.push('Please select a category.');
  if (body.description.length < 10) errs.push('Description must be at least 10 characters.');
  if (errs.length) {
    errEl.textContent = errs[0];
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Posting...';
  try {
    const result = await Api.post('/requests', body);
    if (result.success) {
      Toast.success('Request posted successfully!');
      closeCreateModal();
      document.getElementById('createForm').reset();
      loadRequests();
    } else {
      errEl.textContent = result.message || 'Failed to post request.';
      errEl.style.display = 'block';
    }
  } catch (err) {
    errEl.textContent = err.message || 'Failed to post request.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Post Request';
  }
}

// -----------------------------------------------------------------------
// Page init
// -----------------------------------------------------------------------
async function init() {
  const ok = await Auth.load();
  if (!ok || !Auth.requireAuth(['customer'])) return;

  Layout.renderShell('customer', 'dashboard', 'dashboard');

  const user = Auth.getUser();
  const firstName = (user?.name || 'User').split(' ')[0];
  document.getElementById('welcomeMsg').textContent = `Welcome back, ${firstName}`;

  document.getElementById('statusFilter').addEventListener('change', loadRequests);
  document.getElementById('sortFilter').addEventListener('change', loadRequests);
  document.getElementById('refreshBtn').addEventListener('click', loadRequests);
  document.getElementById('openCreateTopBtn').addEventListener('click', openCreateModal);
  document.getElementById('closeCreateTopBtn').addEventListener('click', closeCreateModal);
  document.getElementById('closeCreateBtn').addEventListener('click', closeCreateModal);
  document.getElementById('createBtn').addEventListener('click', submitRequest);

  document.querySelectorAll('.stat-card').forEach(card => {
    card.addEventListener('click', () => filterRequests(card.dataset.filter));
  });

  // Close modal on backdrop click
  document.getElementById('createModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeCreateModal();
  });

  await loadCategories();
  await loadRequests();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
