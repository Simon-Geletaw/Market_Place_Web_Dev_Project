<!DOCTYPE html>
<html lang="en" data-role="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Manage your service requests, track offers, and connect with providers.">
  <title>Customer Dashboard — ServiceLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <script src="../../core/guard.js"></script>
</head>
<body>

<header id="app-header"></header>

<div class="app-shell">
  <aside id="app-sidebar"></aside>

  <main class="app-content">
    <div class="page-header">
      <div>
        <div class="page-header__title" id="welcomeMsg">My Dashboard</div>
        <div class="page-header__subtitle">Track your service requests and offers</div>
      </div>
      <button class="btn btn--primary" id="openCreateTopBtn">+ Post New Request</button>
    </div>

    <!-- Stat Cards -->
    <div class="grid-4 mb-lg" id="statCards">
      <div class="stat-card stat-card--requested" data-filter="Requested">
        <div class="stat-card__icon" style="background:#e8f4ff">📋</div>
        <div class="stat-card__value" id="cntRequested">—</div>
        <div class="stat-card__label">Requested</div>
      </div>
      <div class="stat-card stat-card--negotiating" data-filter="Negotiating">
        <div class="stat-card__icon" style="background:#fff4e0">💬</div>
        <div class="stat-card__value" id="cntNegotiating">—</div>
        <div class="stat-card__label">Negotiating</div>
      </div>
      <div class="stat-card stat-card--assigned" data-filter="Assigned">
        <div class="stat-card__icon" style="background:#e8f5eb">✅</div>
        <div class="stat-card__value" id="cntAssigned">—</div>
        <div class="stat-card__label">Assigned</div>
      </div>
      <div class="stat-card stat-card--completed" data-filter="Completed">
        <div class="stat-card__icon" style="background:#e0faf4">🎉</div>
        <div class="stat-card__value" id="cntCompleted">—</div>
        <div class="stat-card__label">Completed</div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <select class="form-select" id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Requested">Requested</option>
        <option value="Negotiating">Negotiating</option>
        <option value="Assigned">Assigned</option>
        <option value="Completed">Completed</option>
        <option value="Reviewed">Reviewed</option>
      </select>
      <select class="form-select" id="sortFilter">
        <option value="desc">Newest First</option>
        <option value="asc">Oldest First</option>
      </select>
      <button class="btn btn--secondary btn--sm" id="refreshBtn">↻ Refresh</button>
    </div>

    <!-- Requests List -->
    <div id="requestsList"></div>
  </main>
</div>

<!-- Create Request Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title">Post a New Service Request</h2>
      <button class="modal__close" id="closeCreateTopBtn">✕</button>
    </div>
    <div class="modal__body">
      <form id="createForm" novalidate>
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select class="form-select" id="crCategory">
            <option value="">Loading categories...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Description *</label>
          <textarea class="form-textarea" id="crDesc" rows="4" placeholder="Describe the problem in detail (min 10 characters)..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Location *</label>
            <select class="form-select" id="crLocation">
              <option value="">Select sub-city...</option>
              <option>Addis Ketema</option><option>Akaki Kaliti</option><option>Arada</option>
              <option>Bole</option><option>Gulele</option><option>Kirkos</option>
              <option>Kolfe Keranio</option><option>Lideta</option><option>Nifas Silk-Lafto</option>
              <option>Yeka</option><option>Lemi Kura</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Preferred Date</label>
            <input class="form-input" type="date" id="crDate">
          </div>
        </div>
        <div id="createFormError" class="form-error" style="display:none;color:#dc3545;font-size:0.875rem;margin-top:4px;"></div>
      </form>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" id="closeCreateBtn" type="button">Cancel</button>
      <button class="btn btn--primary" id="createBtn" type="button">Post Request</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
import Api   from '../../core/api.js';
import Auth  from '../../core/auth.js';
import Toast from '../../core/toast.js';
import Layout from '../../core/layout.js';

const BADGE = {
  Requested: 'badge--requested', Negotiating: 'badge--negotiating',
  Assigned: 'badge--assigned',   Completed: 'badge--completed',
  Reviewed: 'badge--reviewed'
};

// -----------------------------------------------------------------------
// Load dynamic categories from API into the create-request form
// -----------------------------------------------------------------------
async function loadCategories() {
  try {
    const res  = await Api.get('/categories');
    const cats = res.data || [];
    const sel  = document.getElementById('crCategory');
    sel.innerHTML = '<option value="">Select category...</option>' +
      cats.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  } catch {
    // Fallback to hardcoded list if API unavailable
    document.getElementById('crCategory').innerHTML = `
      <option value="">Select category...</option>
      <option>Electrician</option><option>Plumber</option><option>Carpenter</option>
      <option>Painter</option><option>Cleaner</option><option>General Handyman</option>`;
  }
}

// -----------------------------------------------------------------------
// Load and render requests
// -----------------------------------------------------------------------
async function loadRequests() {
  const status = document.getElementById('statusFilter').value;
  const sort   = document.getElementById('sortFilter').value;
  const list   = document.getElementById('requestsList');
  list.innerHTML = '<div class="empty-state"><div class="spinner spinner--dark"></div><p>Loading your requests...</p></div>';
  try {
    const res      = await Api.get(`/requests?status=${encodeURIComponent(status)}&sort=${sort}`);
    const requests = Array.isArray(res.data) ? res.data : [];
    updateStats(requests);
    if (!requests.length) {
      list.innerHTML = `<div class="empty-state">
        <div class="empty-state__icon">📋</div>
        <div class="empty-state__title">No requests found</div>
        <p class="empty-state__text">Post your first service request to get started.</p>
        <button class="btn btn--primary" id="emptyCreateBtn">Post a Request</button>
      </div>`;
      document.getElementById('emptyCreateBtn')?.addEventListener('click', openCreateModal);
      return;
    }
    list.innerHTML = requests.map(renderCard).join('');
  } catch (err) {
    list.innerHTML = `<div class="empty-state"><p class="text-muted">${esc(err.message || 'Could not load requests.')}</p></div>`;
  }
}

function updateStats(requests) {
  const count = s => requests.filter(r => r.status === s).length;
  document.getElementById('cntRequested').textContent  = count('Requested');
  document.getElementById('cntNegotiating').textContent = count('Negotiating');
  document.getElementById('cntAssigned').textContent   = count('Assigned');
  document.getElementById('cntCompleted').textContent  = count('Completed');
}

function renderCard(r) {
  // Backend has no TITLE — use first 60 chars of description as card heading
  const heading = (r.description || '').length > 60
    ? r.description.substring(0, 60) + '...'
    : (r.description || '—');

  const actionMap = {
    Negotiating: `<a href="../request-detail.html?id=${r.id}" class="btn btn--ghost btn--sm">Manage Offers</a>`,
    Assigned:    `<a href="../request-detail.html?id=${r.id}" class="btn btn--ghost btn--sm">Track Progress</a>`,
    Completed:   `<a href="../request-detail.html?id=${r.id}" class="btn btn--secondary btn--sm">Leave Review</a>`,
  };

  return `
  <div class="request-card mb-md">
    <div class="request-card__header">
      <div>
        <div class="request-card__title">${esc(heading)}</div>
        <div class="request-card__meta">
          <span>📍 ${esc(r.location || '—')}</span>
          <span>🗂 ${esc(r.category_name || r.category || '—')}</span>
          <span>📅 ${r.created_at ? new Date(r.created_at).toLocaleDateString() : '—'}</span>
          ${r.offer_count > 0 ? `<span>💬 ${r.offer_count} offer${r.offer_count > 1 ? 's' : ''}</span>` : ''}
        </div>
      </div>
      <span class="badge ${BADGE[r.status] || ''}">${esc(r.status)}</span>
    </div>
    <p class="request-card__desc">${esc(r.description || '')}</p>
    <div class="request-card__footer">
      <div class="request-card__actions">
        <a href="../request-detail.html?id=${r.id}" class="btn btn--primary btn--sm">View Details</a>
        ${actionMap[r.status] || ''}
      </div>
    </div>
  </div>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// -----------------------------------------------------------------------
// Modal controls
// -----------------------------------------------------------------------
function openCreateModal()  { document.getElementById('createModal').classList.add('open'); }
function closeCreateModal() { document.getElementById('createModal').classList.remove('open'); }
function filterRequests(s)  { document.getElementById('statusFilter').value = s; loadRequests(); }

// -----------------------------------------------------------------------
// Submit new request
// -----------------------------------------------------------------------
async function submitRequest() {
  const btn  = document.getElementById('createBtn');
  const errEl = document.getElementById('createFormError');
  const body = {
    category:       document.getElementById('crCategory').value,
    description:    document.getElementById('crDesc').value.trim(),
    location:       document.getElementById('crLocation').value,
    preferred_date: document.getElementById('crDate').value || null,
  };

  // Client-side validation
  const errs = [];
  if (!body.category)    errs.push('Please select a category.');
  if (body.description.length < 10) errs.push('Description must be at least 10 characters.');
  if (!body.location)    errs.push('Please select a location.');
  if (errs.length) {
    errEl.textContent = errs[0];
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Posting...';
  try {
    const result = await Api.post('/requests', body);
    if (result.success) {
      Toast.success('Request posted successfully!');
      closeCreateModal();
      document.getElementById('createForm').reset();
      loadRequests();
    } else {
      errEl.textContent = result.message || 'Failed to post request.';
      errEl.style.display = 'block';
    }
  } catch (err) {
    errEl.textContent = err.message || 'Failed to post request.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Post Request';
  }
}

// -----------------------------------------------------------------------
// Page init
// -----------------------------------------------------------------------
async function init() {
  const ok = await Auth.load();
  if (!ok || !Auth.requireAuth(['customer'])) return;

  Layout.renderShell('customer', 'dashboard', 'dashboard');
  document.getElementById('welcomeMsg').textContent =
    `Welcome, ${Auth.user?.name || 'User'}! 👋`;

  document.getElementById('statusFilter').addEventListener('change', loadRequests);
  document.getElementById('sortFilter').addEventListener('change', loadRequests);
  document.getElementById('refreshBtn').addEventListener('click', loadRequests);
  document.getElementById('openCreateTopBtn').addEventListener('click', openCreateModal);
  document.getElementById('closeCreateTopBtn').addEventListener('click', closeCreateModal);
  document.getElementById('closeCreateBtn').addEventListener('click', closeCreateModal);
  document.getElementById('createBtn').addEventListener('click', submitRequest);

  document.querySelectorAll('.stat-card').forEach(card => {
    card.addEventListener('click', () => filterRequests(card.dataset.filter));
  });

  // Close modal on backdrop click
  document.getElementById('createModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeCreateModal();
  });

  await loadCategories();
  await loadRequests();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
