<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Console — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<header class="app-navbar">
  <div class="navbar">
    <a href="../../landing_page/index.html" class="navbar__logo">
      <div class="navbar__logo-icon">S</div>
      Service<span class="navbar__logo-accent">Link</span>
      <span class="badge badge--verified" style="font-size:10px;margin-left:4px">Admin</span>
    </a>
    <div class="navbar__actions">
      <div class="navbar__user" id="navUser"></div>
      <button class="btn btn--secondary btn--sm" onclick="Auth.logout()">Logout</button>
    </div>
  </div>
</header>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="sidebar">
      <div class="sidebar__label">Admin Panel</div>
      <a href="admin.html" class="sidebar__item active">
        <svg class="sidebar__icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Overview
      </a>
      <a href="../admin/verification.html" class="sidebar__item">
        <svg class="sidebar__icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Provider Verification
      </a>
      <a href="../admin/audit-logs.html" class="sidebar__item">
        <svg class="sidebar__icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
        Audit Logs
      </a>
      <a href="../admin/metrics.html" class="sidebar__item">
        <svg class="sidebar__icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        System Metrics
      </a>
      <a href="../settings.html" class="sidebar__item">
        <svg class="sidebar__icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>
        Settings
      </a>
      <div class="sidebar__footer">
        <button class="btn btn--secondary btn--sm btn--full" onclick="Auth.logout()">Sign Out</button>
      </div>
    </div>
  </aside>

  <main class="app-content">
    <div class="page-header">
      <div>
        <div class="page-header__title">Admin Console</div>
        <div class="page-header__subtitle">Platform overview and management</div>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="grid-4 mb-lg">
      <div class="stat-card stat-card--requested">
        <div class="stat-card__icon" style="background:#e8f4ff">👥</div>
        <div class="stat-card__value" id="totalUsers">—</div>
        <div class="stat-card__label">Total Users</div>
      </div>
      <div class="stat-card stat-card--negotiating">
        <div class="stat-card__icon" style="background:#fff4e0">📋</div>
        <div class="stat-card__value" id="totalRequests">—</div>
        <div class="stat-card__label">Total Requests</div>
      </div>
      <div class="stat-card stat-card--assigned">
        <div class="stat-card__icon" style="background:#e8f5eb">🔧</div>
        <div class="stat-card__value" id="pendingVerification">—</div>
        <div class="stat-card__label">Pending Verification</div>
      </div>
      <div class="stat-card stat-card--completed">
        <div class="stat-card__icon" style="background:#e0faf4">✅</div>
        <div class="stat-card__value" id="completedJobs">—</div>
        <div class="stat-card__label">Completed Jobs</div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Pending Verifications -->
      <div class="card">
        <div class="card__header">
          <h3 style="font-size:16px">Pending Provider Verifications</h3>
          <a href="../admin/verification.html" class="btn btn--ghost btn--sm">View All</a>
        </div>
        <div class="card__body" id="pendingList"></div>
      </div>

      <!-- Recent Activity -->
      <div class="card">
        <div class="card__header">
          <h3 style="font-size:16px">Recent Audit Logs</h3>
          <a href="../admin/audit-logs.html" class="btn btn--ghost btn--sm">View All</a>
        </div>
        <div class="card__body" id="auditList"></div>
      </div>
    </div>
  </main>
</div>

<script src="../../assets/js/modules/api.js"></script>
<script src="../../assets/js/modules/auth.js"></script>
<script src="../../assets/js/modules/toast.js"></script>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

async function init() {
  await Auth.load();
  if (!Auth.requireRole('admin')) return;
  Auth.renderNavUser(document.getElementById('navUser'));
  loadMetrics();
  loadPending();
  loadAudit();
}

async function loadMetrics() {
  try {
    const res = await api.get('/admin/metrics');
    const m = res.data || {};
    document.getElementById('totalUsers').textContent = m.total_users || '—';
    document.getElementById('totalRequests').textContent = m.total_requests || '—';
    document.getElementById('pendingVerification').textContent = m.pending_verifications || '—';
    document.getElementById('completedJobs').textContent = m.completed_jobs || '—';
  } catch {}
}

async function loadPending() {
  const el = document.getElementById('pendingList');
  try {
    const res = await api.get('/admin/providers?verified=0&limit=5');
    const providers = res.data || [];
    if (!providers.length) { el.innerHTML='<p class="text-muted" style="padding:var(--space-md)">No pending verifications.</p>'; return; }
    el.innerHTML = providers.map(p=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-sm) 0;border-bottom:1px solid var(--color-border)">
        <div>
          <div style="font-weight:600;font-size:14px">${esc(p.full_name)}</div>
          <div class="text-sm text-muted">${esc(p.location)} · Joined ${new Date(p.created_at).toLocaleDateString()}</div>
        </div>
        <a href="../admin/verification.html?id=${p.id}" class="btn btn--primary btn--sm">Review</a>
      </div>`).join('');
  } catch { el.innerHTML='<p class="text-muted">Could not load data.</p>'; }
}

async function loadAudit() {
  const el = document.getElementById('auditList');
  try {
    const res = await api.get('/admin/audit-logs?limit=6');
    const logs = res.data || [];
    if (!logs.length) { el.innerHTML='<p class="text-muted" style="padding:var(--space-md)">No recent activity.</p>'; return; }
    el.innerHTML = logs.map(l=>`
      <div style="padding:var(--space-sm) 0;border-bottom:1px solid var(--color-border)">
        <div style="font-size:13px;font-weight:500">${esc(l.action)}</div>
        <div class="text-sm text-muted">${esc(l.user_name||'System')} · ${new Date(l.created_at).toLocaleString()}</div>
      </div>`).join('');
  } catch { el.innerHTML='<p class="text-muted">Could not load logs.</p>'; }
}

init();
</script>
</body>
</html>
