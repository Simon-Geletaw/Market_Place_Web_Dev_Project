<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Request — Provider View — ServiceLink</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<header class="app-navbar">
  <div class="navbar">
    <a href="../landing_page/index.html" class="navbar__logo">
      <div class="navbar__logo-icon">S</div>
      Service<span class="navbar__logo-accent">Link</span>
    </a>
    <nav class="navbar__nav">
      <a href="marketplace.html" class="navbar__link">Browse</a>
      <a href="dashboard/provider.html" class="navbar__link">Dashboard</a>
    </nav>
    <div class="navbar__actions">
      <div class="navbar__user" id="navUser"></div>
      <button class="btn btn--secondary btn--sm" onclick="Auth.logout()">Logout</button>
    </div>
  </div>
</header>

<div style="padding-top:var(--navbar-height)">
  <div class="container" style="padding-top:var(--space-xl);padding-bottom:var(--space-xxl)">

    <div class="breadcrumb">
      <a href="marketplace.html">Browse</a>
      <span class="breadcrumb__sep">›</span>
      <span id="breadTitle">Request Detail</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:var(--space-xl);align-items:start">
      <div id="requestContent"><div class="empty-state"><div class="spinner spinner--dark"></div></div></div>
      <div style="position:sticky;top:calc(var(--navbar-height) + var(--space-lg))">
        <div id="offerPanel"></div>
      </div>
    </div>
  </div>
</div>

<!-- Offer Modal -->
<div class="modal-overlay" id="offerModal">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title" id="offerModalTitle">Submit Your Offer</h2>
      <button class="modal__close" onclick="closeModal('offerModal')">✕</button>
    </div>
    <div class="modal__body">
      <div class="info-box" id="offerSummary"></div>
      <div class="form-group">
        <label class="form-label">Your Price (ETB) *</label>
        <input class="form-input" type="number" id="offerPrice" placeholder="e.g., 450" min="50" max="10000">
        <div class="form-hint" id="budgetHint"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Optional Message</label>
        <textarea class="form-textarea" id="offerMessage" placeholder="Tell the customer about your experience..." maxlength="500"></textarea>
        <div class="char-count" id="charCount">0/500</div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('offerModal')">Cancel</button>
      <button class="btn btn--primary" id="submitOfferBtn" onclick="submitOffer()">Submit Offer</button>
    </div>
  </div>
</div>

<!-- Complete Modal -->
<div class="modal-overlay" id="completeModal">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title">Mark Job as Complete</h2>
      <button class="modal__close" onclick="closeModal('completeModal')">✕</button>
    </div>
    <div class="modal__body">
      <div class="info-box" id="completeSummary"></div>
      <div class="form-group">
        <label class="form-label">Upload Completion Photo *</label>
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('photoInput').click()">
          <div class="upload-zone__icon">📷</div>
          <p>Click to upload (JPG/PNG, max 5MB)</p>
        </div>
        <input type="file" id="photoInput" accept="image/jpeg,image/png" style="display:none" onchange="previewPhoto(this)">
        <div id="photoPreview"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-textarea" id="completeNotes" placeholder="Describe what was done..."></textarea>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('completeModal')">Cancel</button>
      <button class="btn btn--primary" id="submitCompleteBtn" onclick="submitComplete()">Mark as Complete</button>
    </div>
  </div>
</div>

<script src="../assets/js/modules/api.js"></script>
<script src="../assets/js/modules/auth.js"></script>
<script src="../assets/js/modules/toast.js"></script>
<script>
const BADGE = { Requested:'badge--requested', Negotiating:'badge--negotiating', Assigned:'badge--assigned', Completed:'badge--completed', Reviewed:'badge--reviewed' };
const TIMELINE = ['Requested','Negotiating','Assigned','Completed','Reviewed'];
let request = null;
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

const requestId = new URLSearchParams(location.search).get('id');

async function init() {
  await Auth.load();
  if (!Auth.requireAuth()) return;
  Auth.renderNavUser(document.getElementById('navUser'));
  loadRequest();
}

async function loadRequest() {
  try {
    const res = await api.get(`/requests/${requestId}`);
    request = res.data;
    document.getElementById('breadTitle').textContent = request.title;
    renderContent();
    renderOfferPanel();
  } catch {
    document.getElementById('requestContent').innerHTML = '<div class="empty-state"><p class="text-muted">Request not found.</p></div>';
  }
}

function renderContent() {
  const r = request;
  const si = TIMELINE.indexOf(r.status);
  document.getElementById('requestContent').innerHTML = `
    <div class="flex-between mb-md" style="flex-wrap:wrap;gap:var(--space-sm)">
      <span class="badge" style="background:#f0f0f0;color:#666;font-size:11px">${esc(r.category_name||r.category)}</span>
      <span class="badge ${BADGE[r.status]||''}">${r.status}</span>
    </div>
    <h1 style="font-size:22px;margin-bottom:var(--space-lg)">${esc(r.title)}</h1>
    <div class="card mb-md">
      <div class="card__header"><h3 style="font-size:15px">Details</h3></div>
      <div class="card__body">
        <div class="info-row"><span class="info-row__label">Location</span><span class="info-row__val">${esc(r.location)}</span></div>
        <div class="info-row"><span class="info-row__label">Preferred Date</span><span class="info-row__val">${r.preferred_date||'Flexible'}</span></div>
        <div class="info-row"><span class="info-row__label">Budget</span><span class="info-row__val">${r.budget ? r.budget + ' ETB' : 'Open'}</span></div>
        <div class="info-row"><span class="info-row__label">Total Offers</span><span class="info-row__val">${r.offer_count||0}</span></div>
      </div>
    </div>
    <div class="card mb-md">
      <div class="card__header"><h3 style="font-size:15px">Description</h3></div>
      <div class="card__body" style="line-height:1.7">${esc(r.description)}</div>
    </div>
    <div class="card">
      <div class="card__header"><h3 style="font-size:15px">Status Timeline</h3></div>
      <div class="card__body">
        <ul class="timeline">
          ${TIMELINE.map((s,i)=>`<li class="timeline__item ${i<si?'done':i===si?'active':''}">
            <div class="timeline__dot">${i<si?'✓':i+1}</div>
            <div class="timeline__body"><div class="timeline__label">${s}</div>${i<=si?`<div class="timeline__time">${i===si?'Current':'Completed'}</div>`:''}</div>
          </li>`).join('')}
        </ul>
      </div>
    </div>`;
}

function renderOfferPanel() {
  const r = request;
  const panel = document.getElementById('offerPanel');
  const myOffer = (r.offers||[]).find(o => o.provider_id === Auth.user?.id);

  if (r.status === 'Assigned' && r.assigned_provider_id === Auth.user?.id) {
    panel.innerHTML = `
      <div class="card">
        <div class="card__header"><h3 style="font-size:15px">Your Job ✅</h3></div>
        <div class="card__body">
          <p class="text-muted mb-md">You are assigned to this job. Mark it complete when done.</p>
          <button class="btn btn--primary btn--full" onclick="openCompleteModal()">Mark as Complete</button>
        </div>
      </div>`;
    return;
  }

  if (myOffer) {
    panel.innerHTML = `
      <div class="card">
        <div class="card__header"><h3 style="font-size:15px">Your Offer</h3></div>
        <div class="card__body">
          <div class="info-row"><span class="info-row__label">Price</span><span class="info-row__val offer-card__price">${parseFloat(myOffer.price_offered).toLocaleString()} ETB</span></div>
          <div class="info-row"><span class="info-row__label">Status</span><span class="info-row__val"><span class="badge badge--${myOffer.status}">${myOffer.status}</span></span></div>
          ${myOffer.message ? `<p class="text-sm text-muted mt-md">${esc(myOffer.message)}</p>` : ''}
        </div>
      </div>`;
    return;
  }

  if (['Requested','Negotiating'].includes(r.status)) {
    panel.innerHTML = `
      <div class="card">
        <div class="card__header"><h3 style="font-size:15px">Submit an Offer</h3></div>
        <div class="card__body">
          <p class="text-muted mb-md">Interested in this job? Submit your price.</p>
          <button class="btn btn--primary btn--full" onclick="openOfferModal()">Submit Offer</button>
        </div>
      </div>`;
    return;
  }

  panel.innerHTML = `<div class="card"><div class="card__body"><p class="text-muted text-sm">This request is no longer accepting offers.</p></div></div>`;
}

function openOfferModal() {
  const r = request;
  document.getElementById('offerSummary').innerHTML = `
    <div class="info-row"><span class="info-row__label">Request</span><span class="info-row__val">${esc(r.title)}</span></div>
    <div class="info-row"><span class="info-row__label">Location</span><span class="info-row__val">${esc(r.location)}</span></div>
    <div class="info-row"><span class="info-row__label">Budget</span><span class="info-row__val">${r.budget ? r.budget + ' ETB' : 'Open'}</span></div>`;
  if (r.budget) document.getElementById('budgetHint').textContent = `Customer budget: ${r.budget} ETB`;
  document.getElementById('offerModal').classList.add('open');
}

function openCompleteModal() {
  const r = request;
  document.getElementById('completeSummary').innerHTML = `<div class="info-row"><span class="info-row__label">Job</span><span class="info-row__val">${esc(r.title)}</span></div>`;
  document.getElementById('completeModal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.getElementById('offerMessage').addEventListener('input', function() {
  document.getElementById('charCount').textContent = `${this.value.length}/500`;
});

async function submitOffer() {
  const price = document.getElementById('offerPrice').value;
  if (!price || price < 50) { Toast.error('Enter a valid price (min 50 ETB).'); return; }
  const btn = document.getElementById('submitOfferBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Submitting...';
  try {
    await api.post(`/requests/${requestId}/offers`, { price_offered: parseFloat(price), message: document.getElementById('offerMessage').value });
    Toast.success('Offer submitted!');
    closeModal('offerModal');
    loadRequest();
  } catch (err) {
    Toast.error(err.message || 'Failed to submit offer.');
    btn.disabled = false; btn.textContent = 'Submit Offer';
  }
}

function previewPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { Toast.error('File too large (max 5MB).'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('photoPreview').innerHTML = `<div class="upload-preview"><img src="${e.target.result}" alt="Preview"><br><a href="#" onclick="clearPhoto()">Remove</a></div>`;
  };
  reader.readAsDataURL(file);
}
function clearPhoto() { document.getElementById('photoInput').value=''; document.getElementById('photoPreview').innerHTML=''; }

async function submitComplete() {
  const fileInput = document.getElementById('photoInput');
  if (!fileInput.files[0]) { Toast.error('Please upload a completion photo.'); return; }
  const btn = document.getElementById('submitCompleteBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Submitting...';
  const fd = new FormData();
  fd.append('photo', fileInput.files[0]);
  fd.append('notes', document.getElementById('completeNotes').value);
  try {
    await api.upload(`/requests/${requestId}/complete`, fd);
    Toast.success('Job marked as complete!');
    closeModal('completeModal');
    loadRequest();
  } catch (err) {
    Toast.error(err.message || 'Failed.');
    btn.disabled = false; btn.textContent = 'Mark as Complete';
  }
}

init();
</script>
</body>
</html>
