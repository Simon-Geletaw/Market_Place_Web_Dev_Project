<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Requests — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <script src="../../core/guard.js"></script>
</head>
<body>
<header id="app-header"></header>
<div class="app-shell">
  <aside id="app-sidebar"></aside>
  <main class="app-content">
    <div class="page-header">
      <div><div class="page-header__title">My Requests</div><div class="page-header__subtitle">All service requests you have posted</div></div>
      <button class="btn btn--primary" id="openCreateBtn">+ New Request</button>
    </div>
    <div class="filter-bar">
      <select class="form-select" id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Requested">Requested</option><option value="Negotiating">Negotiating</option>
        <option value="Assigned">Assigned</option><option value="Completed">Completed</option><option value="Reviewed">Reviewed</option>
      </select>
      <select class="form-select" id="sortFilter">
        <option value="desc">Newest</option><option value="asc">Oldest</option>
      </select>
    </div>
    <div id="list"></div>
  </main>
</div>

<div class="modal-overlay" id="createModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitleCreate">
    <div class="modal__header"><h2 class="modal__title" id="modalTitleCreate">Post a New Request</h2><button class="modal__close" id="closeCreateTopBtn" aria-label="Close new request modal">✕</button></div>
    <div class="modal__body">
      <div class="form-group"><label class="form-label">Category</label>
        <select class="form-select" id="crCat"><option value="">Select...</option><option>Electrician</option><option>Plumber</option><option>Carpenter</option><option>Painter</option><option>Cleaner</option><option>General Handyman</option></select></div>
      <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="crTitle" placeholder="e.g., Fix door lock"></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="crDesc" placeholder="Describe the job..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Location</label>
          <select class="form-select" id="crLoc"><option value="">Sub-city...</option><option>Bole</option><option>Kirkos</option><option>Addis Ketema</option><option>Arada</option><option>Yeka</option></select></div>
        <div class="form-group"><label class="form-label">Preferred Date</label><input class="form-input" type="date" id="crDate"></div>
      </div>
      <div class="form-group"><label class="form-label">Budget (ETB) — optional</label><input class="form-input" type="number" id="crBudget" placeholder="e.g., 500"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" id="closeCreateBtn">Cancel</button>
      <button class="btn btn--primary" id="createBtn">Post Request</button>
    </div>
  </div>
</div>

<script type="module">
import Api from '../../core/api.js';
import Auth from '../../core/auth.js';
import Toast from '../../core/toast.js';
import Layout from '../../core/layout.js';

const BADGE={Requested:'badge--requested',Negotiating:'badge--negotiating',Assigned:'badge--assigned',Completed:'badge--completed',Reviewed:'badge--reviewed'};
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

async function load(){
  const status=document.getElementById('statusFilter').value,sort=document.getElementById('sortFilter').value;
  const el=document.getElementById('list');el.innerHTML='<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  try{
    const res=await Api.get(`/requests?status=${status}&sort=${sort}`);
    const r=res.data||[];
    if(!r.length){el.innerHTML='<div class="empty-state"><div class="empty-state__icon">📋</div><div class="empty-state__title">No requests yet</div><p class="empty-state__text">Post your first request to get started.</p><button class="btn btn--primary" id="emptyCreateBtn">Post a Request</button></div>';
      const emptyBtn = document.getElementById('emptyCreateBtn');
      if (emptyBtn) emptyBtn.addEventListener('click', openCreate);
      return;
    }
    el.innerHTML=r.map(req=>`<div class="request-card mb-md">
      <div class="request-card__header"><div><div class="request-card__title">${esc(req.title)}</div>
      <div class="request-card__meta"><span>📍${esc(req.location)}</span><span>🗂${esc(req.category_name||req.category)}</span><span>${new Date(req.created_at).toLocaleDateString()}</span>${req.offer_count?`<span>💬${req.offer_count} offer(s)</span>`:''}</div></div>
      <span class="badge ${BADGE[req.status]||''}">${req.status}</span></div>
      <p class="request-card__desc">${esc(req.description)}</p>
      <div class="request-card__footer"><div class="request-card__actions">
        <a href="../request-detail.html?id=${req.id}" class="btn btn--primary btn--sm">View Details</a>
        ${req.status==='Negotiating'?`<a href="../request-detail.html?id=${req.id}" class="btn btn--ghost btn--sm">Manage Offers</a>`:''}
        ${req.status==='Completed'?`<a href="../request-detail.html?id=${req.id}" class="btn btn--secondary btn--sm">Leave Review</a>`:''}
      </div></div></div>`).join('');
  }catch{el.innerHTML='<div class="empty-state"><p class="text-muted">Could not load requests.</p></div>';}
}

function openCreate(){document.getElementById('createModal').classList.add('open');}
function closeCreate(){document.getElementById('createModal').classList.remove('open');}

async function submitCreate(){
  const body={category:document.getElementById('crCat').value,title:document.getElementById('crTitle').value,description:document.getElementById('crDesc').value,location:document.getElementById('crLoc').value,preferred_date:document.getElementById('crDate').value,budget:document.getElementById('crBudget').value||null};
  if(!body.category||!body.title||!body.description||!body.location){Toast.error('Fill all required fields.');return;}
  const btn=document.getElementById('createBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Posting...';
  try{
    const result = await Api.post('/requests',body);
    if(result.success) {
      Toast.success('Request posted!');closeCreate();load();
    } else {
      Toast.error(result.message || 'Failed to post request.');
    }
  }catch(e){Toast.error(e.message||'Failed.');}
  finally{btn.disabled=false;btn.textContent='Post Request';}
}

async function init(){
  await Auth.load();
  if(!Auth.requireAuth()) return;
  Layout.renderShell('customer', 'requests', 'dashboard');
  
  document.getElementById('statusFilter').addEventListener('change', load);
  document.getElementById('sortFilter').addEventListener('change', load);
  document.getElementById('openCreateBtn').addEventListener('click', openCreate);
  document.getElementById('closeCreateTopBtn').addEventListener('click', closeCreate);
  document.getElementById('closeCreateBtn').addEventListener('click', closeCreate);
  document.getElementById('createBtn').addEventListener('click', submitCreate);
  
  load();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
