<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Notifications — ServiceLink</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<header class="app-navbar">
  <div class="navbar">
    <a href="../landing_page/index.html" class="navbar__logo"><div class="navbar__logo-icon">S</div>Service<span class="navbar__logo-accent">Link</span></a>
    <div class="navbar__actions"><div class="navbar__user" id="navUser"></div><button class="btn btn--secondary btn--sm" onclick="Auth.logout()">Logout</button></div>
  </div>
</header>
<div style="padding-top:var(--navbar-height)">
  <div class="container" style="padding-top:var(--space-xl);max-width:700px">
    <div class="page-header">
      <div><div class="page-header__title">Notifications</div><div class="page-header__subtitle">Your recent activity alerts</div></div>
      <button class="btn btn--secondary btn--sm" id="markAllBtn" onclick="markAllRead()">Mark all read</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script src="../assets/js/modules/api.js"></script>
<script src="../assets/js/modules/auth.js"></script>
<script src="../assets/js/modules/toast.js"></script>
<script>
const ICON = { offer_received:'💬', offer_accepted:'✅', offer_rejected:'❌', job_completed:'🎉', review_received:'⭐', job_assigned:'🔧' };
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
async function init(){
  await Auth.load();if(!Auth.requireAuth())return;
  Auth.renderNavUser(document.getElementById('navUser'));load();
}
async function load(){
  const el=document.getElementById('list');el.innerHTML='<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  try{
    const res=await api.get('/notifications');const notifs=res.data||[];
    if(!notifs.length){el.innerHTML='<div class="empty-state"><div class="empty-state__icon">🔔</div><div class="empty-state__title">All caught up!</div><p class="empty-state__text">No notifications yet.</p></div>';return;}
    el.innerHTML=notifs.map(n=>`
      <div class="card mb-sm" style="border-left:4px solid ${n.is_read?'var(--color-border)':'var(--color-primary)'}">
        <div class="card__body" style="display:flex;gap:var(--space-md);align-items:flex-start">
          <div style="font-size:24px;flex-shrink:0">${ICON[n.type]||'🔔'}</div>
          <div style="flex:1">
            <div style="font-weight:${n.is_read?'400':'600'};font-size:14px">${esc(n.message)}</div>
            <div class="text-sm text-muted mt-sm">${new Date(n.created_at).toLocaleString()}</div>
          </div>
          ${n.link?`<a href="${esc(n.link)}" class="btn btn--secondary btn--sm">View</a>`:''}
        </div>
      </div>`).join('');
  }catch{el.innerHTML='<div class="empty-state"><p class="text-muted">Could not load notifications.</p></div>';}
}
async function markAllRead(){
  try{await api.post('/notifications/read-all');Toast.success('All marked as read.');load();}
  catch{Toast.error('Failed.');}
}
init();
</script>
</body>
</html>
