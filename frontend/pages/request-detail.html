<!DOCTYPE html>
<html lang="en" data-role="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Request Detail — ServiceLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../core/guard.js"></script>
  <style>
    .offer-card { border:1px solid var(--color-border); border-radius:10px; padding:14px; margin-bottom:10px; background:#fff; transition:.2s; }
    .offer-card:hover { box-shadow:0 2px 12px rgba(0,0,0,.08); }
    .offer-card__header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .offer-card__provider { display:flex; align-items:center; gap:10px; }
    .offer-card__price { font-size:1.1rem; font-weight:700; color:var(--color-primary); }
    .offer-card__actions { display:flex; gap:8px; margin-top:10px; }
    .star { font-size:24px; cursor:pointer; color:#ccc; transition:color .15s; }
    .star.active { color:#f59e0b; }
    .timeline { list-style:none; padding:0; margin:0; position:relative; }
    .timeline::before { content:''; position:absolute; left:14px; top:0; bottom:0; width:2px; background:#e2e8f0; }
    .timeline__item { display:flex; gap:16px; align-items:flex-start; padding:10px 0; position:relative; }
    .timeline__dot { width:30px; height:30px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; z-index:1; }
    .timeline__item.active .timeline__dot { background:var(--color-primary); color:#fff; }
    .timeline__item.done .timeline__dot { background:#10b981; color:#fff; }
    .info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:.9rem; }
    .info-row__label { color:#666; }
    .info-row__val { font-weight:500; }
    .counter-form { background:#f8f9fa; border-radius:8px; padding:12px; margin-top:10px; display:none; }
    .counter-form.open { display:block; }
    @media (max-width: 768px) {
      #requestContent > div { grid-template-columns: 1fr !important; }
      #actionPanel { position: static !important; }
    }
  </style>
</head>
<body>
<header id="app-header"></header>

<div class="app-shell">
  <aside id="app-sidebar"></aside>
  <main class="app-content">

    <div class="breadcrumb mb-md">
      <a href="dashboard/customer.html">Dashboard</a>
      <span class="breadcrumb__sep">›</span>
      <span id="breadTitle">Request Detail</span>
    </div>

    <div id="requestContent">
      <div class="empty-state"><div class="spinner spinner--dark"></div><p>Loading request...</p></div>
    </div>

  </main>
</div>

<!-- Accept Offer Modal -->
<div class="modal-overlay" id="acceptModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitleAccept">
    <div class="modal__header">
      <h2 class="modal__title" id="modalTitleAccept">Accept Offer & Schedule</h2>
      <button class="modal__close" onclick="closeModal('acceptModal')" aria-label="Close modal">✕</button>
    </div>
    <div class="modal__body">
      <p class="text-muted mb-md" id="acceptFor">Provide location and scheduling details to proceed.</p>
      <input type="hidden" id="acceptOfferId">
      <div class="form-group">
        <label class="form-label">Location *</label>
        <select class="form-select" id="acceptLocation">
          <option value="">Select sub-city...</option>
          <option>Addis Ketema</option><option>Akaki Kaliti</option><option>Arada</option>
          <option>Bole</option><option>Gulele</option><option>Kirkos</option>
          <option>Kolfe Keranio</option><option>Lideta</option><option>Nifas Silk-Lafto</option>
          <option>Yeka</option><option>Lemi Kura</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date *</label>
          <input class="form-input" type="date" id="acceptDate">
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('acceptModal')">Cancel</button>
      <button class="btn btn--primary" id="confirmAcceptBtn">Confirm & Accept</button>
    </div>
  </div>
</div>

<!-- Review Modal -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitleReview">
    <div class="modal__header">
      <h2 class="modal__title" id="modalTitleReview">Leave a Review</h2>
      <button class="modal__close" onclick="closeModal('reviewModal')" aria-label="Close review modal">✕</button>
    </div>
    <div class="modal__body">
      <p class="text-muted mb-md" id="reviewFor">Rate your provider</p>
      <div class="form-group">
        <label class="form-label">Rating *</label>
        <div class="star-rating" id="starRating">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
          <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>
        </div>
        <input type="hidden" id="ratingVal" value="0">
      </div>
      <div class="form-group">
        <label class="form-label">Feedback (optional)</label>
        <textarea class="form-textarea" id="reviewComment" placeholder="Share your experience..." maxlength="500"></textarea>
        <div class="char-count" id="reviewCharCount" style="text-align:right;font-size:.8rem;color:#999">0/500</div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" onclick="closeModal('reviewModal')">Cancel</button>
      <button class="btn btn--primary" id="submitReviewBtn">Submit Review</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
import Api    from '../core/api.js';
import Auth   from '../core/auth.js';
import Toast  from '../core/toast.js';
import Layout from '../core/layout.js';

const BADGE    = { Requested:'badge--requested', Negotiating:'badge--negotiating', Assigned:'badge--assigned', Completed:'badge--completed', Reviewed:'badge--reviewed' };
const OFFER_BADGE = { Pending:'badge--pending', Countered:'badge--countered', Accepted:'badge--accepted', Rejected:'badge--rejected' };
const TIMELINE = ['Requested','Negotiating','Assigned','Completed','Reviewed'];
let request    = null;
let offers     = [];
let ratingSelected = 0;

const requestId = new URLSearchParams(location.search).get('id');
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// -----------------------------------------------------------------------
// Load request + offers in parallel
// -----------------------------------------------------------------------
async function loadAll() {
  const content = document.getElementById('requestContent');
  content.innerHTML = '<div class="empty-state"><div class="spinner spinner--dark"></div><p>Loading...</p></div>';
  try {
    // Load request first, then if it's Negotiating or Requested → load offers
    const res = await Api.get(`/requests/${requestId}`);
    request   = res.data;

    const heading = (request.description || '').substring(0, 60) + ((request.description || '').length > 60 ? '...' : '');
    document.getElementById('breadTitle').textContent = heading;
    document.title = heading + ' — ServiceLink';

    // Fetch offers for all statuses where the customer needs to see them:
    // Negotiating (manage offers), Assigned/Completed/Reviewed (see who was hired)
    if (['Requested','Negotiating','Assigned','Completed','Reviewed'].includes(request.status)) {
      try {
        const offersRes = await Api.get(`/requests/${requestId}/offers`);
        offers = Array.isArray(offersRes.data) ? offersRes.data : [];
      } catch { offers = []; }
    }

    render();
  } catch (err) {
    content.innerHTML = `<div class="empty-state"><p class="text-muted">${esc(err.message || 'Request not found.')}</p></div>`;
  }
}

function render() {
  const r = request;
  const user = Auth.getUser();
  const isOwner = user && (r.customer_id === user.id || r.customer_id === user.USER_ID);
  const statusIdx = TIMELINE.indexOf(r.status);

  document.getElementById('requestContent').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start">
      <!-- Left: Info -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <span class="badge" style="background:#f0f0f0;color:#555">${esc(r.category_name || '—')}</span>
          <span class="badge ${BADGE[r.status] || ''}">${esc(r.status)}</span>
        </div>
        <h1 style="font-size:1.3rem;margin-bottom:16px;line-height:1.5">${esc(r.description)}</h1>

        <div class="card mb-md">
          <div class="card__header"><h3 style="font-size:14px">Request Details</h3></div>
          <div class="card__body">
            <div class="info-row"><span class="info-row__label">Location</span><span class="info-row__val">📍 ${esc(r.location || '—')}</span></div>
            <div class="info-row"><span class="info-row__label">Preferred Date</span><span class="info-row__val">📅 ${r.preferred_date || 'Flexible'}</span></div>
            <div class="info-row"><span class="info-row__label">Offers Received</span><span class="info-row__val">💬 ${r.offer_count || 0}</span></div>
            <div class="info-row"><span class="info-row__label">Posted</span><span class="info-row__val">${r.created_at ? new Date(r.created_at).toLocaleString() : '—'}</span></div>
          </div>
        </div>

        <div class="card">
          <div class="card__header"><h3 style="font-size:14px">Status Timeline</h3></div>
          <div class="card__body">
            <ul class="timeline">
              ${TIMELINE.map((s,i) => `
                <li class="timeline__item ${i < statusIdx ? 'done' : i === statusIdx ? 'active' : ''}">
                  <div class="timeline__dot">${i < statusIdx ? '✓' : i+1}</div>
                  <div>
                    <div style="font-weight:600;font-size:.9rem">${s}</div>
                    <div style="font-size:.8rem;color:#999">${i === statusIdx ? 'Current state' : i < statusIdx ? 'Completed' : 'Pending'}</div>
                  </div>
                </li>`).join('')}
            </ul>
          </div>
        </div>
      </div>

      <!-- Right: Action Panel -->
      <div style="position:sticky;top:80px" id="actionPanel"></div>
    </div>`;

  renderActionPanel(isOwner);
}

function renderActionPanel(isOwner) {
  const r     = request;
  const panel = document.getElementById('actionPanel');

  // ── Reviewed / Assigned: info only
  if (r.status === 'Reviewed') {
    const accepted = offers.find(o => o.status === 'Accepted');
    panel.innerHTML = `<div class="card"><div class="card__body">
      <div class="empty-state" style="padding:var(--space-lg)">
        <div class="empty-state__icon">✅</div>
        <div class="empty-state__title" style="font-size:1rem">Completed &amp; Reviewed</div>
        ${accepted ? `<p class="text-muted text-sm" style="margin-top:8px">Provider: <strong>${esc(accepted.provider_name || '—')}</strong></p>` : ''}
        ${r.accepted_price ? `<p class="text-muted text-sm">Final Price: <strong>ETB ${parseFloat(r.accepted_price).toLocaleString()}</strong></p>` : ''}
      </div>
    </div></div>`;
    return;
  }

  // ── Completed: leave review
  if (r.status === 'Completed' && isOwner) {
    const accepted = offers.find(o => o.status === 'Accepted');
    panel.innerHTML = `<div class="card"><div class="card__header"><h3 style="font-size:14px">Job Complete 🎉</h3></div>
      <div class="card__body">
        ${accepted ? `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:40px;height:40px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">
              ${esc((accepted.provider_name || 'P')[0].toUpperCase())}
            </div>
            <div>
              <div style="font-weight:600">${esc(accepted.provider_name || 'Provider')}</div>
              <div style="font-size:.8rem;color:#999">⭐ ${accepted.provider_rating ? parseFloat(accepted.provider_rating).toFixed(1) : 'New'}</div>
            </div>
          </div>` : ''}
        <p class="text-muted mb-md" style="font-size:.9rem">The provider has marked this job complete. Leave a review to finish.</p>
        <button class="btn btn--primary btn--full" id="leaveReviewBtn">⭐ Leave a Review</button>
      </div>
    </div>`;
    document.getElementById('leaveReviewBtn')?.addEventListener('click', openReviewModal);
    return;
  }

  // ── Assigned: show who is working
  if (r.status === 'Assigned') {
    const accepted = offers.find(o => o.status === 'Accepted');
    panel.innerHTML = `<div class="card"><div class="card__header"><h3 style="font-size:14px">✅ Job Assigned</h3></div>
      <div class="card__body">
        ${accepted ? `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:40px;height:40px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">
              ${esc((accepted.provider_name || 'P')[0].toUpperCase())}
            </div>
            <div>
              <div style="font-weight:600">${esc(accepted.provider_name || 'Provider')}</div>
              <div style="font-size:.8rem;color:#999">⭐ ${accepted.provider_rating ? parseFloat(accepted.provider_rating).toFixed(1) : 'New'}</div>
            </div>
          </div>` : ''}
        <p class="text-muted" style="font-size:.9rem">A provider has been assigned and will begin work soon.</p>
        ${r.accepted_price ? `<p style="margin-top:8px"><strong>Agreed Price:</strong> ETB ${parseFloat(r.accepted_price).toLocaleString()}</p>` : ''}
        ${r.preferred_date ? `<p style="margin-top:4px"><strong>Scheduled:</strong> ${esc(r.preferred_date)}</p>` : ''}
      </div>
    </div>`;
    return;
  }

  // ── Negotiating / Requested: show offers for customer
  if (['Negotiating','Requested'].includes(r.status) && isOwner) {
    const activeOffers = offers.filter(o => o.status !== 'Rejected');
    const rejectedOffers = offers.filter(o => o.status === 'Rejected');

    panel.innerHTML = `
      <div class="card">
        <div class="card__header">
          <h3 style="font-size:14px">Offers Received (${activeOffers.length})</h3>
          <button class="btn btn--ghost btn--sm" onclick="loadAll()">↻</button>
        </div>
        <div class="card__body" id="offersBody">
          ${!activeOffers.length
            ? `<p class="text-muted" style="font-size:.9rem;text-align:center;padding:16px 0">No active offers.<br>Active offers will appear here.</p>`
            : activeOffers.map(o => `
              <div class="offer-card">
                <div class="offer-card__header">
                  <div class="offer-card__provider">
                    <div style="width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">
                      ${esc((o.provider_name || 'P')[0].toUpperCase())}
                    </div>
                    <div>
                      <div style="font-weight:600;font-size:.9rem">${esc(o.provider_name || 'Provider')}</div>
                      <div style="font-size:.8rem;color:#999">⭐ ${o.provider_rating ? parseFloat(o.provider_rating).toFixed(1) : 'New'}</div>
                    </div>
                  </div>
                  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
                    <span class="badge ${OFFER_BADGE[o.status] || ''}">${esc(o.status || 'Pending')}</span>
                    <div class="offer-card__price">ETB ${parseFloat(o.price || 0).toLocaleString()}</div>
                  </div>
                </div>
                ${o.message ? `<p style="font-size:.85rem;color:#555;margin:6px 0">${esc(o.message)}</p>` : ''}
                ${o.counter_price ? `<div style="background:#fff4e0;border-radius:6px;padding:8px;font-size:.85rem;margin:6px 0">
                  <strong>Counter offer:</strong> ETB ${parseFloat(o.counter_price).toLocaleString()}
                  ${o.counter_message ? `<br><em>${esc(o.counter_message)}</em>` : ''}
                </div>` : ''}
                <div class="offer-card__actions">
                  <button class="btn btn--success btn--sm" onclick="acceptOffer('${o.id}')">✓ Accept</button>
                  <button class="btn btn--danger btn--sm" onclick="rejectOffer('${o.id}')">✗ Reject</button>
                  <button class="btn btn--ghost btn--sm" onclick="toggleCounter('counter-${o.id}')">↔ Counter</button>
                </div>
                <div class="counter-form" id="counter-${o.id}">
                  <input class="form-input" type="number" placeholder="Your counter price (ETB)" id="counter-price-${o.id}" min="1">
                  <textarea class="form-textarea" placeholder="Message (optional)" id="counter-msg-${o.id}" rows="2" style="margin-top:6px"></textarea>
                  <div style="display:flex;gap:6px;margin-top:6px">
                    <button class="btn btn--primary btn--sm" onclick="submitCounter('${o.id}')">Send Counter</button>
                    <button class="btn btn--ghost btn--sm" onclick="toggleCounter('counter-${o.id}')">Cancel</button>
                  </div>
                </div>
              </div>`).join('')
          }

          ${rejectedOffers.length ? `
            <div style="margin-top:20px; border-top:1px dashed #eee; padding-top:16px;">
              <button class="btn btn--secondary btn--sm btn--full" id="toggleRejectedBtn" onclick="
                const el = document.getElementById('rejectedOffersList');
                if (el.style.display === 'none') {
                  el.style.display = 'block';
                  this.textContent = 'Hide Rejected Offers';
                } else {
                  el.style.display = 'none';
                  this.textContent = 'Show Rejected Offers (${rejectedOffers.length})';
                }
              ">Show Rejected Offers (${rejectedOffers.length})</button>
              
              <div id="rejectedOffersList" style="display:none; margin-top:12px;">
                ${rejectedOffers.map(o => `
                  <div class="offer-card" style="opacity: 0.7; background: #fafafa; border: 1px dashed #ddd;">
                    <div class="offer-card__header">
                      <div class="offer-card__provider">
                        <div style="width:34px;height:34px;border-radius:50%;background:#ccc;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">
                          ${esc((o.provider_name || 'P')[0].toUpperCase())}
                        </div>
                        <div>
                          <div style="font-weight:600;font-size:.9rem;color:#777;">${esc(o.provider_name || 'Provider')}</div>
                          <div style="font-size:.8rem;color:#aaa">⭐ ${o.provider_rating ? parseFloat(o.provider_rating).toFixed(1) : 'New'}</div>
                        </div>
                      </div>
                      <div class="offer-card__price" style="color:#777;">ETB ${parseFloat(o.price || 0).toLocaleString()}</div>
                    </div>
                    ${o.message ? `<p style="font-size:.85rem;color:#777;margin:6px 0">${esc(o.message)}</p>` : ''}
                    <div style="margin-top:10px;"><span class="badge" style="background:#fee2e2;color:#ef4444;border: 1px solid #fca5a5;">${esc(o.status)}</span></div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      </div>`;
    limitOfferActions(panel, activeOffers, r.status);
    return;
  }

  panel.innerHTML = `<div class="card"><div class="card__body">
    <p class="text-muted" style="font-size:.9rem">Status: <strong>${esc(r.status)}</strong></p>
  </div></div>`;
}

function limitOfferActions(panel, renderedOffers, requestStatus) {
  panel.querySelectorAll('.offer-card').forEach((card, index) => {
    const offer = renderedOffers[index];
    if (!offer) return;

    const canDecide = requestStatus === 'Negotiating' && ['Pending', 'Countered'].includes(offer.status);
    const canCounter = requestStatus === 'Negotiating' && offer.status === 'Pending';
    const [acceptBtn, rejectBtn, counterBtn] = card.querySelectorAll('.offer-card__actions button');

    if (acceptBtn) acceptBtn.hidden = !canDecide;
    if (rejectBtn) rejectBtn.hidden = !canDecide;
    if (counterBtn) counterBtn.hidden = !canCounter;

    const counterForm = card.querySelector('.counter-form');
    if (counterForm && !canCounter) counterForm.hidden = true;

    const actions = card.querySelector('.offer-card__actions');
    if (actions && !canDecide && !canCounter) actions.hidden = true;
  });
}

// -----------------------------------------------------------------------
// Offer actions (exposed globally for onclick handlers)
// -----------------------------------------------------------------------
window.acceptOffer = function(offerId) {
  const o = offers.find(x => x.id === offerId);
  if (!o) return;
  document.getElementById('acceptOfferId').value = offerId;
  document.getElementById('acceptFor').textContent = `Accept offer from ${o.provider_name || 'Provider'} for ETB ${parseFloat(o.price || 0).toLocaleString()}`;
  document.getElementById('acceptLocation').value = request?.location || '';
  document.getElementById('acceptDate').value = (request?.preferred_date || '').slice(0, 10);
  document.getElementById('acceptModal').classList.add('open');
};

window.confirmAccept = async function() {
  const offerId = document.getElementById('acceptOfferId').value;
  const location = document.getElementById('acceptLocation').value;
  const date = document.getElementById('acceptDate').value;

  if (!location) { Toast.error('Please select a location.'); return; }
  if (!date) { Toast.error('Please select a date.'); return; }

  const btn = document.getElementById('confirmAcceptBtn');
  btn.disabled = true; btn.textContent = 'Accepting...';

  try {
    await Api.patch(`/offers/${offerId}/accept`, { location, date });
    Toast.success('Offer accepted! Job assigned.');
    closeModal('acceptModal');
    loadAll();
  } catch (err) { 
    Toast.error(err.message || 'Failed to accept offer.');
  } finally {
    btn.disabled = false; btn.textContent = 'Confirm & Accept';
  }
};

window.rejectOffer = async function(offerId) {
  if (!confirm('Reject this offer?')) return;
  try {
    await Api.patch(`/offers/${offerId}/reject`, {});
    Toast.success('Offer rejected.');
    loadAll();
  } catch (err) { Toast.error(err.message || 'Failed.'); }
};

window.toggleCounter = function(id) {
  document.getElementById(id)?.classList.toggle('open');
};

window.submitCounter = async function(offerId) {
  const priceEl = document.getElementById(`counter-price-${offerId}`);
  const msgEl   = document.getElementById(`counter-msg-${offerId}`);
  const price   = parseFloat(priceEl?.value);
  if (!price || price < 1) { Toast.error('Enter a valid counter price.'); return; }
  try {
    await Api.patch(`/offers/${offerId}/counter`, {
      counter_price: price,
      counter_message: msgEl?.value?.trim() || null,
    });
    Toast.success('Counter offer sent!');
    loadAll();
  } catch (err) { Toast.error(err.message || 'Failed to send counter.'); }
};

// -----------------------------------------------------------------------
// Review modal
// -----------------------------------------------------------------------
function openReviewModal() {
  document.getElementById('reviewFor').textContent =
    `Rate your experience for: ${(request?.description||'').substring(0,50)}`;
  document.getElementById('reviewModal').classList.add('open');
}
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };

document.getElementById('starRating').addEventListener('click', e => {
  const star = e.target.closest('.star');
  if (!star) return;
  ratingSelected = parseInt(star.dataset.v);
  document.getElementById('ratingVal').value = ratingSelected;
  document.querySelectorAll('#starRating .star').forEach((s,i) =>
    s.classList.toggle('active', i < ratingSelected)
  );
});

document.getElementById('reviewComment').addEventListener('input', function() {
  document.getElementById('reviewCharCount').textContent = `${this.value.length}/500`;
});

async function submitReview() {
  if (ratingSelected < 1) { Toast.error('Please select a rating (1–5 stars).'); return; }
  const btn = document.getElementById('submitReviewBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';
  try {
    await Api.post(`/requests/${requestId}/review`, {
      rating: ratingSelected,
      comment: document.getElementById('reviewComment').value.trim(),
    });
    Toast.success('Review submitted! Thank you.');
    closeModal('reviewModal');
    loadAll();
  } catch (err) {
    Toast.error(err.message || 'Failed to submit review.');
    btn.disabled = false; btn.textContent = 'Submit Review';
  }
}

// -----------------------------------------------------------------------
// Init
// -----------------------------------------------------------------------
async function init() {
  if (!requestId) { window.history.back(); return; }
  const ok = await Auth.load();
  if (!ok || !Auth.requireAuth(['customer'])) return;

  Layout.renderShell('customer', 'requests', 'dashboard');

  document.getElementById('confirmAcceptBtn').addEventListener('click', confirmAccept);
  document.getElementById('submitReviewBtn').addEventListener('click',   submitReview);

  loadAll();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
