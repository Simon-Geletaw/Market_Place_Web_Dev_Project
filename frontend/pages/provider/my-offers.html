<!DOCTYPE html>
<html lang="en" data-role="provider">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Offers — ServiceLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <script src="../../core/guard.js"></script>
</head>
<body>
<header id="app-header"></header>
<div class="app-shell">
  <aside id="app-sidebar"></aside>
  <main class="app-content">
    <div class="page-header">
      <div>
        <div class="page-header__title">My Offers</div>
        <div class="page-header__subtitle">All offers you have submitted to service requests</div>
      </div>
      <a href="../marketplace.html" class="btn btn--primary">🔍 Browse More Requests</a>
    </div>
    <div class="filter-bar">
      <select class="form-select" id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Accepted">Accepted</option>
        <option value="Rejected">Rejected</option>
        <option value="Countered">Countered</option>
      </select>
      <button class="btn btn--secondary btn--sm" id="refreshBtn">↻ Refresh</button>
    </div>
    <div id="list"></div>
  </main>
</div>
<div class="toast-container" id="toastContainer"></div>
<script type="module">
import Api    from '../../core/api.js';
import Auth   from '../../core/auth.js';
import Layout from '../../core/layout.js';

const BADGE = { Pending:'badge--negotiating', Accepted:'badge--assigned', Rejected:'badge--danger', Countered:'badge--requested' };
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

async function load() {
  const status = document.getElementById('statusFilter').value;
  const el = document.getElementById('list');
  el.innerHTML = '<div class="empty-state"><div class="spinner spinner--dark"></div><p>Loading offers...</p></div>';
  try {
    const res    = await Api.get(`/offers?status=${encodeURIComponent(status)}`);
    const offers = Array.isArray(res.data) ? res.data : [];
    if (!offers.length) {
      el.innerHTML = `<div class="empty-state">
        <div class="empty-state__icon">📤</div>
        <div class="empty-state__title">No offers yet</div>
        <p class="empty-state__text">Browse requests and submit your first offer.</p>
        <a href="../marketplace.html" class="btn btn--primary">Browse Requests</a>
      </div>`;
      return;
    }
    el.innerHTML = `<div class="table-wrapper"><table class="data-table">
      <thead><tr><th>Request</th><th>Your Price (ETB)</th><th>Status</th><th>Counter Offer</th><th>Submitted</th><th></th></tr></thead>
      <tbody>
      ${offers.map(o => `<tr>
        <td>
          <a href="../request-detail-provider.html?id=${o.request_id}">${esc(o.request_description ? o.request_description.substring(0,50)+'...' : 'View Request')}</a>
          <div class="text-sm text-muted">📍 ${esc(o.request_location || '—')}</div>
        </td>
        <td><strong>${parseFloat(o.price||0).toLocaleString()}</strong></td>
        <td><span class="badge ${BADGE[o.status]||''}">${esc(o.status)}</span></td>
        <td>${o.counter_price ? `ETB ${parseFloat(o.counter_price).toLocaleString()}<br><small class="text-muted">${esc(o.counter_message||'')}</small>` : '—'}</td>
        <td class="text-sm text-muted">${o.created_at ? new Date(o.created_at).toLocaleDateString() : '—'}</td>
        <td><a href="../request-detail-provider.html?id=${o.request_id}" class="btn btn--ghost btn--sm">View</a></td>
      </tr>`).join('')}
      </tbody></table></div>`;
  } catch (err) {
    el.innerHTML = `<div class="empty-state"><p class="text-muted">${esc(err.message || 'Could not load offers.')}</p></div>`;
  }
}

async function init() {
  const ok = await Auth.load();
  if (!ok || !Auth.requireAuth(['provider'])) return;
  Layout.renderShell('provider', 'my-offers', 'provider');
  document.getElementById('statusFilter').addEventListener('change', load);
  document.getElementById('refreshBtn').addEventListener('click', load);
  load();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
