<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Offers — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<header class="app-navbar">
  <div class="navbar">
    <a href="../../landing_page/index.html" class="navbar__logo"><div class="navbar__logo-icon">S</div>Service<span class="navbar__logo-accent">Link</span></a>
    <nav class="navbar__nav"><a href="../marketplace.html" class="navbar__link">Browse</a><a href="../dashboard/provider.html" class="navbar__link">Dashboard</a></nav>
    <div class="navbar__actions"><div class="navbar__user" id="navUser"></div><button class="btn btn--secondary btn--sm" onclick="Auth.logout()">Logout</button></div>
  </div>
</header>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="sidebar">
      <div class="sidebar__label">Provider Menu</div>
      <a href="../dashboard/provider.html" class="sidebar__item">📊 Dashboard</a>
      <a href="../marketplace.html" class="sidebar__item">🔍 Browse Requests</a>
      <a href="my-offers.html" class="sidebar__item active">📤 My Offers</a>
      <a href="assigned-jobs.html" class="sidebar__item">✅ Assigned Jobs</a>
      <a href="completed-jobs.html" class="sidebar__item">🎉 Completed Jobs</a>
      <a href="reviews-received.html" class="sidebar__item">⭐ Reviews Received</a>
      <a href="../settings.html" class="sidebar__item">⚙️ Settings</a>
      <div class="sidebar__footer"><button class="btn btn--secondary btn--sm btn--full" onclick="Auth.logout()">Sign Out</button></div>
    </div>
  </aside>
  <main class="app-content">
    <div class="page-header">
      <div><div class="page-header__title">My Offers</div><div class="page-header__subtitle">All offers you have submitted</div></div>
      <a href="../marketplace.html" class="btn btn--primary">Browse More Requests</a>
    </div>
    <div class="filter-bar">
      <select class="form-select" id="statusFilter" onchange="load()">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option><option value="accepted">Accepted</option>
        <option value="rejected">Rejected</option><option value="countered">Countered</option>
      </select>
    </div>
    <div id="list"></div>
  </main>
</div>
<script src="../../assets/js/modules/api.js"></script>
<script src="../../assets/js/modules/auth.js"></script>
<script>
const BADGE={pending:'badge--pending',accepted:'badge--accepted',rejected:'badge--rejected',countered:'badge--countered'};
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
async function init(){await Auth.load();if(!Auth.requireAuth())return;Auth.renderNavUser(document.getElementById('navUser'));load();}
async function load(){
  const status=document.getElementById('statusFilter').value;
  const el=document.getElementById('list');el.innerHTML='<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  try{
    const res=await api.get(`/offers?status=${status}`);const offers=res.data||[];
    if(!offers.length){el.innerHTML='<div class="empty-state"><div class="empty-state__icon">📤</div><div class="empty-state__title">No offers yet</div><p class="empty-state__text">Browse requests and submit your first offer.</p><a href="../marketplace.html" class="btn btn--primary">Browse Requests</a></div>';return;}
    el.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Request</th><th>Your Price</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody>
      ${offers.map(o=>`<tr>
        <td><a href="../request-detail-provider.html?id=${o.request_id}">${esc(o.request_title||'Request')}</a><div class="text-sm text-muted">📍${esc(o.request_location||'')}</div></td>
        <td><strong>${parseFloat(o.price_offered).toLocaleString()} ETB</strong></td>
        <td><span class="badge ${BADGE[o.status]||''}">${o.status}</span></td>
        <td class="text-muted text-sm">${new Date(o.created_at).toLocaleDateString()}</td>
        <td><a href="../request-detail-provider.html?id=${o.request_id}" class="btn btn--secondary btn--sm">View</a></td>
      </tr>`).join('')}
    </tbody></table></div>`;
  }catch{el.innerHTML='<div class="empty-state"><p class="text-muted">Could not load offers.</p></div>';}
}
init();
</script>
</body>
</html>
