<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Jobs — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    @media (max-width: 768px) {
      .request-card__header {
        flex-direction: column;
        align-items: flex-start;
      }
      .request-card__footer {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
      .badge {
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
<div id="app-header"></div>
<div class="app-shell">
  <div id="app-sidebar"></div>
  <main class="app-content">
    <div class="page-header">
      <div>
        <div class="page-header__title">Assigned Jobs</div>
        <div class="page-header__subtitle">Jobs you are currently assigned to complete</div>
      </div>
    </div>
    <div id="list"></div>
  </main>
</div>
<script type="module">
import Layout from '../../core/layout.js';
import Auth from '../../core/auth.js';
import Api from '../../core/api.js';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

async function init() {
  await Auth.load();
  if (!Auth.requireAuth(['provider'])) return;
  Layout.renderShell('provider', 'assigned', 'dashboard');

  const el = document.getElementById('list');
  el.innerHTML = '<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  
  try {
    const res = await Api.get('/provider/jobs/assigned');
    const jobs = res.data || [];
    
    if (!jobs.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">✅</div><div class="empty-state__title">No assigned jobs</div><p class="empty-state__text">Your accepted jobs will appear here.</p></div>';
      return;
    }
    
    el.innerHTML = jobs.map(j => `<div class="request-card mb-md">
      <div class="request-card__header">
        <div>
          <div class="request-card__title">${esc(j.title)}</div>
          <div class="request-card__meta">
            <span>🗂 ${esc(j.category_name||j.category)}</span>
            <span>📅 Scheduled: <strong>${j.preferred_date ? esc(j.preferred_date) : 'Pending'}</strong></span>
          </div>
        </div>
        <span class="badge badge--assigned">Assigned</span>
      </div>
      <p class="request-card__desc">${esc(j.description)}</p>
      
      <div style="background:#f8f9fa; border-radius:6px; padding:12px; margin:12px 0; display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div>
          <div class="text-sm text-muted">Customer Location</div>
          <div style="font-weight:600">📍 ${esc(j.location || '—')}</div>
        </div>
        <div>
          <div class="text-sm text-muted">Agreed Price</div>
          <div style="font-weight:600; color:var(--color-primary)">ETB ${parseFloat(j.accepted_price||0).toLocaleString()}</div>
        </div>
      </div>

      <div class="request-card__footer">
        <span class="text-sm text-muted">Customer: ${esc(j.customer_name||'—')}</span>
        <div class="request-card__actions">
          <a href="../request-detail-provider.html?id=${j.id}" class="btn btn--primary btn--sm">View & Complete Job</a>
        </div>
      </div>
    </div>`).join('');
  } catch (err) {
    el.innerHTML = '<div class="empty-state"><p class="text-muted">Could not load jobs.</p></div>';
  }
}

init();
</script>
</body>
</html>
