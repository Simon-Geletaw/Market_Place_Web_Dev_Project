<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews Received — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    @media (max-width: 768px) {
      .flex-between { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }
  </style>
</head>
<body>
<div id="app-header"></div>
<div class="app-shell">
  <div id="app-sidebar"></div>
  <main class="app-content">
    <div class="page-header">
      <div><div class="page-header__title">Reviews Received</div><div class="page-header__subtitle" id="avgLine">Your customer feedback</div></div>
    </div>
    <div id="list"></div>
  </main>
</div>
<script type="module">
import Layout from '../../core/layout.js';
import Auth from '../../core/auth.js';
import Api from '../../core/api.js';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}

async function init(){
  await Auth.load();
  if(!Auth.requireAuth(['provider'])) return;
  Layout.renderShell('provider', 'reviews', 'dashboard');

  const el=document.getElementById('list');
  el.innerHTML='<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  
  try {
    const res=await Api.get('/reviews/received');
    const reviews=res.data||[];
    
    if(reviews.length){
      const avg=(reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1);
      document.getElementById('avgLine').textContent=`Average rating: ${avg} ⭐ (${reviews.length} review${reviews.length!==1?'s':''})`;
    } else {
      el.innerHTML='<div class="empty-state"><div class="empty-state__icon">⭐</div><div class="empty-state__title">No reviews yet</div><p class="empty-state__text">Complete jobs to receive customer reviews.</p></div>';
      return;
    }
    
    el.innerHTML=reviews.map(rv=>`<div class="card mb-md">
      <div class="card__body">
        <div class="flex-between mb-md">
          <div>
            <div style="font-weight:600">${esc(rv.request_title||'Service Job')}</div>
            <div class="text-sm text-muted">From: ${esc(rv.customer_name||'Customer')}</div>
          </div>
          <div style="color:#FFA500;font-size:18px">${stars(rv.rating)}</div>
        </div>
        ${rv.comment?`<p style="line-height:1.6">"${esc(rv.comment)}"</p>`:'<p class="text-muted text-sm">No comment provided.</p>'}
        <div class="text-sm text-muted mt-sm">${new Date(rv.created_at).toLocaleDateString()}</div>
      </div>
    </div>`).join('');
  } catch (err) {
    el.innerHTML='<div class="empty-state"><p class="text-muted">Could not load reviews.</p></div>';
  }
}
init();
</script>
</body>
</html>
