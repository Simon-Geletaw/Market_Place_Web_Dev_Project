<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230066CC'/%3E%3Cpath d='M10 16L14.5 20.5L22 11' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews Received — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    @media (max-width: 768px) {
      .flex-between { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }
  </style>
</head>
<body>
<div id="app-header"></div>
<div class="app-shell">
  <div id="app-sidebar"></div>
  <main class="app-content">
    <div class="page-header">
      <div><div class="page-header__title">Reviews Received</div><div class="page-header__subtitle" id="avgLine">Your customer feedback</div></div>
    </div>
    <div id="list"></div>
  </main>
</div>
<script type="module">
import Layout from '../../core/layout.js';
import Auth from '../../core/auth.js';
import Api from '../../core/api.js';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}

async function init(){
  await Auth.load();
  if(!Auth.requireAuth(['provider'])) return;
  Layout.renderShell('provider', 'reviews', 'dashboard');

  const el=document.getElementById('list');
  el.innerHTML='<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  
  try {
    const res=await Api.get('/reviews/received');
    const reviews=res.data||[];
    
    if(reviews.length){
      const avg=(reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1);
      document.getElementById('avgLine').textContent=`Average rating: ${avg} ⭐ (${reviews.length} review${reviews.length!==1?'s':''})`;
    } else {
      el.innerHTML='<div class="empty-state"><div class="empty-state__icon">⭐</div><div class="empty-state__title">No reviews yet</div><p class="empty-state__text">Complete jobs to receive customer reviews.</p></div>';
      return;
    }
    
    el.innerHTML = reviews.map(rv => `
    <div class="card mb-md" style="border-left: 4px solid var(--color-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
      <div class="card__body">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
          <div>
            <h3 style="font-size:1.1rem; font-weight:600; margin-bottom:4px; color:#111;">${esc(rv.request_title||'Service Job')}</h3>
            <div class="text-sm text-muted">Reviewed by <strong style="color:#333">${esc(rv.customer_name||'Customer')}</strong></div>
          </div>
          <div style="background:#fff4e0; padding:4px 8px; border-radius:12px; display:inline-flex; align-items:center; gap:4px;">
            <span style="color:#f59e0b; font-size:16px; letter-spacing:2px;">${stars(rv.rating)}</span>
            <span style="font-weight:700; color:#b45309; font-size:0.9rem; margin-left:4px">${rv.rating}.0</span>
          </div>
        </div>
        
        <div style="background:#f8f9fa; padding:16px; border-radius:8px; position:relative;">
          <span style="position:absolute; top:8px; left:8px; font-size:24px; color:#e2e8f0; font-family:serif; line-height:1">"</span>
          ${rv.comment ? 
            `<p style="line-height:1.6; color:#444; font-style:italic; padding-left:16px;">${esc(rv.comment)}</p>` : 
            '<p class="text-muted text-sm" style="padding-left:16px; font-style:italic;">No detailed feedback provided.</p>'}
        </div>
        
        <div class="text-sm text-muted" style="margin-top:12px; text-align:right;">
          ${new Date(rv.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}
        </div>
      </div>
    </div>`).join('');
  } catch (err) {
    el.innerHTML='<div class="empty-state"><p class="text-muted">Could not load reviews.</p></div>';
  }
}
init();
</script>
</body>
</html>
