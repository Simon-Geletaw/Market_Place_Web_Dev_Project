<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completed Jobs — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    @media (max-width: 768px) {
      .request-card__header { flex-direction: column; align-items: flex-start; }
      .request-card__footer { flex-direction: column; gap: 1rem; align-items: flex-start; }
      .badge { margin-top: 0.5rem; }
    }
  </style>
</head>
<body>
<div id="app-header"></div>
<div class="app-shell">
  <div id="app-sidebar"></div>
  <main class="app-content">
    <div class="page-header">
      <div><div class="page-header__title">Completed Jobs</div><div class="page-header__subtitle">Your full job history</div></div>
    </div>
    <div id="list"></div>
  </main>
</div>
<script type="module">
import Layout from '../../core/layout.js';
import Auth from '../../core/auth.js';
import Api from '../../core/api.js';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function stars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):'Not rated'}

async function init(){
  await Auth.load();
  if(!Auth.requireAuth(['provider'])) return;
  Layout.renderShell('provider', 'completed', 'dashboard');

  const el=document.getElementById('list');
  el.innerHTML='<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  
  try {
    const res=await Api.get('/provider/jobs/completed');
    const jobs=res.data||[];
    
    if(!jobs.length){
      el.innerHTML='<div class="empty-state"><div class="empty-state__icon">🎉</div><div class="empty-state__title">No completed jobs yet</div></div>';
      return;
    }
    
    el.innerHTML=jobs.map(j=>`<div class="request-card mb-md">
      <div class="request-card__header">
        <div>
          <div class="request-card__title">${esc(j.title)}</div>
          <div class="request-card__meta"><span>📍${esc(j.location)}</span><span>${new Date(j.updated_at||j.created_at).toLocaleDateString()}</span></div>
        </div>
        <span class="badge ${j.status==='Reviewed'?'badge--reviewed':'badge--completed'}">${esc(j.status)}</span>
      </div>
      <div class="request-card__footer">
        <div>${j.review_rating?`<span style="color:#FFA500">${stars(j.review_rating)}</span> <span class="text-sm text-muted">${esc(j.review_comment||'')}</span>`:'<span class="text-sm text-muted">Awaiting review</span>'}</div>
        <a href="../request-detail-provider.html?id=${j.id}" class="btn btn--secondary btn--sm">View</a>
      </div>
    </div>`).join('');
  } catch (err) {
    el.innerHTML='<div class="empty-state"><p class="text-muted">Could not load jobs.</p></div>';
  }
}
init();
</script>
</body>
</html>
