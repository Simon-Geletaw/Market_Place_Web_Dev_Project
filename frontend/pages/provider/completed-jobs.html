<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Completed Jobs — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<header class="app-navbar">
  <div class="navbar">
    <a href="../../landing_page/index.html" class="navbar__logo"><div class="navbar__logo-icon">S</div>Service<span class="navbar__logo-accent">Link</span></a>
    <div class="navbar__actions"><div class="navbar__user" id="navUser"></div><button class="btn btn--secondary btn--sm" onclick="Auth.logout()">Logout</button></div>
  </div>
</header>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="sidebar">
      <div class="sidebar__label">Provider Menu</div>
      <a href="../dashboard/provider.html" class="sidebar__item">📊 Dashboard</a>
      <a href="../marketplace.html" class="sidebar__item">🔍 Browse Requests</a>
      <a href="my-offers.html" class="sidebar__item">📤 My Offers</a>
      <a href="assigned-jobs.html" class="sidebar__item">✅ Assigned Jobs</a>
      <a href="completed-jobs.html" class="sidebar__item active">🎉 Completed Jobs</a>
      <a href="reviews-received.html" class="sidebar__item">⭐ Reviews Received</a>
      <div class="sidebar__footer"><button class="btn btn--secondary btn--sm btn--full" onclick="Auth.logout()">Sign Out</button></div>
    </div>
  </aside>
  <main class="app-content">
    <div class="page-header">
      <div><div class="page-header__title">Completed Jobs</div><div class="page-header__subtitle">Your full job history</div></div>
    </div>
    <div id="list"></div>
  </main>
</div>
<script src="../../assets/js/modules/api.js"></script>
<script src="../../assets/js/modules/auth.js"></script>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function stars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):'Not rated'}
async function init(){await Auth.load();if(!Auth.requireAuth())return;Auth.renderNavUser(document.getElementById('navUser'));
  const el=document.getElementById('list');el.innerHTML='<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  try{
    const res=await api.get('/requests/completed');const jobs=res.data||[];
    if(!jobs.length){el.innerHTML='<div class="empty-state"><div class="empty-state__icon">🎉</div><div class="empty-state__title">No completed jobs yet</div></div>';return;}
    el.innerHTML=jobs.map(j=>`<div class="request-card mb-md">
      <div class="request-card__header"><div>
        <div class="request-card__title">${esc(j.title)}</div>
        <div class="request-card__meta"><span>📍${esc(j.location)}</span><span>${new Date(j.updated_at||j.created_at).toLocaleDateString()}</span></div>
      </div>
      <span class="badge ${j.status==='Reviewed'?'badge--reviewed':'badge--completed'}">${j.status}</span></div>
      <div class="request-card__footer">
        <div>${j.review_rating?`<span style="color:#FFA500">${stars(j.review_rating)}</span> <span class="text-sm text-muted">${esc(j.review_comment||'')}</span>`:'<span class="text-sm text-muted">Awaiting review</span>'}</div>
        <a href="../request-detail-provider.html?id=${j.id}" class="btn btn--secondary btn--sm">View</a>
      </div>
    </div>`).join('');
  }catch{el.innerHTML='<div class="empty-state"><p class="text-muted">Could not load jobs.</p></div>';}
}
init();
</script>
</body>
</html>
