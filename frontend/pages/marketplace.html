<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Browse Services — ServiceLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<header id="app-header"></header>

<main class="marketplace-page">
  <div class="container marketplace-page__container">

    <!-- Search -->
    <div class="marketplace-page__search">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="What service do you need?" aria-label="Search services">
        <button class="search-bar__btn" id="searchBtn">Search</button>
      </div>
    </div>

    <!-- Filters + Grid -->
    <div class="marketplace-page__content">
      <!-- Filters (sidebar) -->
      <aside class="marketplace-page__sidebar">
        <div class="card">
          <div class="card__header"><h4 class="marketplace-page__sidebar-title">Filters</h4></div>
          <div class="card__body marketplace-page__filters">
            <div class="form-group marketplace-page__field">
              <label class="form-label" for="fCategory">Category</label>
              <select class="form-select" id="fCategory">
                <option value="">All</option>
                <option>Electrician</option><option>Plumber</option><option>Carpenter</option>
                <option>Painter</option><option>Cleaner</option><option>General Handyman</option>
              </select>
            </div>
            <div class="form-group marketplace-page__field">
              <label class="form-label" for="fLocation">Location</label>
              <select class="form-select" id="fLocation">
                <option value="">All Sub-cities</option>
                <option>Bole</option><option>Kirkos</option><option>Addis Ketema</option>
                <option>Akaki Kaliti</option><option>Arada</option><option>Yeka</option>
              </select>
            </div>
            <div class="form-group marketplace-page__field">
              <label class="form-label" for="fSort">Sort By</label>
              <select class="form-select" id="fSort">
                <option value="desc">Newest First</option>
                <option value="asc">Oldest First</option>
              </select>
            </div>
            <button class="btn btn--secondary btn--sm" id="clearFiltersBtn">Clear Filters</button>
          </div>
        </div>
      </aside>

      <!-- Results -->
      <div class="marketplace-page__results">
        <div class="flex-between mb-md">
          <p id="resultsCount" class="text-muted text-sm">Loading...</p>
        </div>
        <div id="requestsGrid"></div>
        <div id="pagination" class="pagination"></div>
      </div>
    </div>
  </div>
</main>

<script type="module">
import Api from '../core/api.js';
import Auth from '../core/auth.js';
import Layout from '../core/layout.js';

const BADGE = { Requested:'badge--requested', Negotiating:'badge--negotiating', Assigned:'badge--assigned', Completed:'badge--completed' };
let debounceTimer;
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function normalizeCategoryValue(category) {
  if (!category) return '';
  if (typeof category === 'object') {
    return category.id || category.CATEGORY_ID || category.value || category.name || '';
  }
  return category;
}

function debounceLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(loadRequests, 400); }

async function loadRequests() {
  const search   = document.getElementById('searchInput').value;
  const category = document.getElementById('fCategory').value;
  const location = document.getElementById('fLocation').value;
  const sort     = document.getElementById('fSort').value;
  const grid = document.getElementById('requestsGrid');
  grid.innerHTML = '<div class="empty-state"><div class="spinner spinner--dark"></div></div>';

  try {
    const params = new URLSearchParams();
    if (category) params.set('category_id', normalizeCategoryValue(category));
    if (location) params.set('location', location);
    const res = await Api.get(`/marketplace?${params.toString()}`);
    const requests = res.data || [];

    const user = Auth.getUser();
    const role = user ? user.role : null;
    // Client-side search filter (backend doesn't support free-text search yet)
    const filtered = search
      ? requests.filter(r => (r.description||'').toLowerCase().includes(search.toLowerCase()))
      : requests;
    document.getElementById('resultsCount').textContent = `${filtered.length} request${filtered.length!==1?'s':''} found`;
    if (!filtered.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-state__icon">🔍</div><div class="empty-state__title">No results found</div><p class="empty-state__text">Try adjusting your filters or search terms.</p></div>`;
      return;
    }
    grid.innerHTML = '<div class="grid-2">' + filtered.map(r => {
      const heading   = (r.description||'').substring(0, 60) + ((r.description||'').length > 60 ? '...' : '');
      const detailPage = role === 'provider' ? `request-detail-provider.html?id=${r.id}` : `request-detail.html?id=${r.id}`;
      return `<div class="request-card">
        <div class="request-card__header">
          <div>
            <div class="request-card__title">${esc(heading)}</div>
            <div class="request-card__meta">
              <span>📍 ${esc(r.location || '—')}</span>
              <span>🗂 ${esc(r.category_name || r.category || '—')}</span>
              <span class="text-sm">${timeAgo(r.created_at)}</span>
            </div>
          </div>
          <span class="badge ${BADGE[r.status]||\''}">${esc(r.status)}</span>
        </div>
        <p class="request-card__desc">${esc(r.description || '')}</p>
        <div class="request-card__footer">
          <span class="text-sm text-muted">${r.offer_count||0} offer${r.offer_count!==1?'s':''}</span>
          <a href="${detailPage}" class="btn btn--primary btn--sm">Submit Offer</a>
        </div>
      </div>`;
    }).join('') + '</div>';
  } catch {
    grid.innerHTML = '<div class="empty-state"><p class="text-muted">Could not load requests.</p></div>';
  }
}

function clearFilters() {
  ['fCategory','fLocation','fSort'].forEach(id => document.getElementById(id).value = id==='fSort'?'desc':'');
  document.getElementById('searchInput').value = '';
  loadRequests();
}

function loadCategories() {
  return Api.get('/categories').then(res => {
    const categories = Array.isArray(res.data) ? res.data : [];
    const select = document.getElementById('fCategory');
    if (!select || !categories.length) return;
    select.innerHTML = '<option value="">All</option>' + categories.map(category => {
      const value = normalizeCategoryValue(category);
      const label = category.name || category.NAME || value;
      return `<option value="${esc(value)}">${esc(label)}</option>`;
    }).join('');
  }).catch(() => {});
}

function timeAgo(ts) {
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

async function init() {
  await Auth.load();
  Layout.renderNavbar('app-header', 'browse');
  
  document.getElementById('searchInput').addEventListener('input', debounceLoad);
  document.getElementById('searchBtn').addEventListener('click', loadRequests);
  document.getElementById('fCategory').addEventListener('change', loadRequests);
  document.getElementById('fLocation').addEventListener('change', loadRequests);
  document.getElementById('fSort').addEventListener('change', loadRequests);
  document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);

  await loadCategories();
  loadRequests();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
