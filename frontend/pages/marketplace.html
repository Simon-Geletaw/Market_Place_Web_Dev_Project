<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230066CC'/%3E%3Cpath d='M10 16L14.5 20.5L22 11' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Browse open service requests in your area. Find work, submit offers, and connect with customers.">
  <title>Browse Services — ServiceLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-md);
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--color-primary); }
    .back-link svg { width: 16px; height: 16px; }

    .marketplace-hero {
      text-align: center;
      margin-bottom: var(--space-xl);
    }
    .marketplace-hero h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .marketplace-hero p {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .request-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
    }
    @media (max-width: 768px) {
      .request-grid { grid-template-columns: 1fr; }
    }

    .req-card {
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 20px;
      transition: box-shadow var(--transition), border-color var(--transition);
      display: flex;
      flex-direction: column;
    }
    .req-card:hover { box-shadow: var(--shadow-hover); border-color: #ccc; }
    .req-card__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-sm);
      margin-bottom: 8px;
    }
    .req-card__title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-primary);
      line-height: 1.4;
    }
    .req-card__meta {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .req-card__meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .req-card__meta-item svg { width: 14px; height: 14px; opacity: 0.5; }
    .req-card__desc {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .req-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      border-top: 1px solid var(--color-border);
      padding-top: 12px;
      margin-top: auto;
    }
    .req-card__offers {
      font-size: 12px;
      color: var(--color-text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .req-card__offers svg { width: 14px; height: 14px; opacity: 0.5; }
    .req-card__customer {
      font-size: 12px;
      color: var(--color-text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .req-card__customer svg { width: 14px; height: 14px; opacity: 0.4; }

    .empty-card {
      background: var(--color-bg-white);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-xxl) var(--space-lg);
      text-align: center;
      grid-column: 1 / -1;
    }
    .empty-card__icon { width: 48px; height: 48px; margin: 0 auto var(--space-md); color: var(--color-text-muted); opacity: 0.3; }
    .empty-card__title { font-size: 16px; font-weight: 600; margin-bottom: var(--space-sm); }
    .empty-card__text { color: var(--color-text-secondary); font-size: 14px; }
  </style>
</head>
<body>
<header id="app-header"></header>

<main class="marketplace-page">
  <div class="container marketplace-page__container">

    <!-- Back Button -->
    <a href="javascript:history.back()" class="back-link" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Dashboard
    </a>

    <!-- Hero -->
    <div class="marketplace-hero">
      <h1>Browse Service Requests</h1>
      <p>Find open requests in your area and submit offers to get hired.</p>
    </div>

    <!-- Search -->
    <div class="marketplace-page__search">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by keyword..." aria-label="Search services">
        <button class="search-bar__btn" id="searchBtn">Search</button>
      </div>
    </div>

    <!-- Filters + Grid -->
    <div class="marketplace-page__content">

      <!-- Filters Sidebar -->
      <aside class="marketplace-page__sidebar">
        <div class="card">
          <div class="card__header"><h4 class="marketplace-page__sidebar-title">Filters</h4></div>
          <div class="card__body marketplace-page__filters">
            <div class="form-group marketplace-page__field">
              <label class="form-label" for="fCategory">Category</label>
              <select class="form-select" id="fCategory">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="form-group marketplace-page__field">
              <label class="form-label" for="fLocation">Location</label>
              <select class="form-select" id="fLocation">
                <option value="">All Sub-cities</option>
                <option>Addis Ketema</option><option>Akaki Kaliti</option><option>Arada</option>
                <option>Bole</option><option>Gulele</option><option>Kirkos</option>
                <option>Kolfe Keranio</option><option>Lideta</option><option>Nifas Silk-Lafto</option>
                <option>Yeka</option><option>Lemi Kura</option>
              </select>
            </div>
            <div class="form-group marketplace-page__field">
              <label class="form-label" for="fSort">Sort By</label>
              <select class="form-select" id="fSort">
                <option value="desc">Newest First</option>
                <option value="asc">Oldest First</option>
              </select>
            </div>
            <button class="btn btn--secondary btn--sm btn--full" id="clearFiltersBtn">Clear Filters</button>
          </div>
        </div>
      </aside>

      <!-- Results -->
      <div class="marketplace-page__results">
        <div class="flex-between mb-md">
          <p id="resultsCount" class="text-muted text-sm">Loading...</p>
        </div>
        <div id="requestsGrid" class="request-grid"></div>
      </div>
    </div>
  </div>
</main>

<script type="module">
import Api from '../core/api.js';
import Auth from '../core/auth.js';
import Layout from '../core/layout.js';

/* ── Inline SVG icons ── */
const IC = {
  pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  tag: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
  cal: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  msg: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
  user: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  search: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
};

const BADGE = {
  Requested: 'badge--requested',
  Negotiating: 'badge--negotiating',
  Assigned: 'badge--assigned',
  Completed: 'badge--completed',
};

let debounceTimer;
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function debounceLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(loadRequests, 400); }

function timeAgo(ts) {
  if (!ts) return '';
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

async function loadRequests() {
  const search   = document.getElementById('searchInput').value.trim();
  const category = document.getElementById('fCategory').value;
  const location = document.getElementById('fLocation').value;
  const sort     = document.getElementById('fSort').value;
  const grid     = document.getElementById('requestsGrid');

  grid.innerHTML = '<div class="empty-card"><div class="spinner spinner--dark" style="margin:0 auto"></div><p class="empty-card__text mt-sm">Loading requests...</p></div>';

  try {
    const params = new URLSearchParams();
    // category value is the UUID from the API
    if (category) params.set('category_id', category);
    if (location) params.set('location', location);

    const res = await Api.get(`/marketplace/requests?${params.toString()}`);
    let requests = res.data || [];

    // Client-side text search (backend doesn't support full-text yet)
    if (search) {
      const q = search.toLowerCase();
      requests = requests.filter(r =>
        (r.description || '').toLowerCase().includes(q) ||
        (r.title || '').toLowerCase().includes(q) ||
        (r.category_name || '').toLowerCase().includes(q) ||
        (r.location || '').toLowerCase().includes(q)
      );
    }

    // Client-side sort
    if (sort === 'asc') {
      requests.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    }

    const user = Auth.getUser();
    const role = user ? user.role.toLowerCase() : null;

    document.getElementById('resultsCount').textContent =
      `${requests.length} request${requests.length !== 1 ? 's' : ''} found`;

    if (!requests.length) {
      grid.innerHTML = `<div class="empty-card">
        <div class="empty-card__icon">${IC.search}</div>
        <div class="empty-card__title">No requests found</div>
        <p class="empty-card__text">Try adjusting your filters or check back later for new requests.</p>
      </div>`;
      return;
    }

    grid.innerHTML = requests.map(r => {
      const heading = r.title || ((r.description || '').length > 70
        ? r.description.substring(0, 70) + '...'
        : (r.description || 'Untitled'));
      const detailPage = role === 'provider'
        ? `request-detail-provider.html?id=${r.id}`
        : `request-detail.html?id=${r.id}`;
      const btnLabel = role === 'provider' ? 'Submit Offer' : 'View Details';

      return `<div class="req-card">
        <div class="req-card__top">
          <div class="req-card__title">${esc(heading)}</div>
          <span class="badge ${BADGE[r.status] || ''}">${esc(r.status)}</span>
        </div>
        <div class="req-card__meta">
          <span class="req-card__meta-item">${IC.pin} ${esc(r.location || 'N/A')}</span>
          <span class="req-card__meta-item">${IC.tag} ${esc(r.category_name || 'N/A')}</span>
          <span class="req-card__meta-item">${IC.cal} ${timeAgo(r.created_at)}</span>
        </div>
        <p class="req-card__desc">${esc(r.description || '')}</p>
        <div class="req-card__footer">
          <div style="display:flex;gap:12px;align-items:center">
            <span class="req-card__offers">${IC.msg} ${r.offer_count || 0} offer${(r.offer_count || 0) !== 1 ? 's' : ''}</span>
            ${r.customer_name ? `<span class="req-card__customer">${IC.user} ${esc(r.customer_name)}</span>` : ''}
          </div>
          <a href="${detailPage}" class="btn btn--primary btn--sm">${btnLabel}</a>
        </div>
      </div>`;
    }).join('');

  } catch (err) {
    grid.innerHTML = `<div class="empty-card"><p class="empty-card__text">${esc(err.message || 'Could not load requests.')}</p></div>`;
  }
}

function clearFilters() {
  document.getElementById('fCategory').value = '';
  document.getElementById('fLocation').value = '';
  document.getElementById('fSort').value = 'desc';
  document.getElementById('searchInput').value = '';
  loadRequests();
}

async function loadCategories() {
  try {
    const res = await Api.get('/categories');
    const categories = Array.isArray(res.data) ? res.data : [];
    const select = document.getElementById('fCategory');
    if (!categories.length) return;
    // Use category UUID as value for proper backend filtering
    select.innerHTML = '<option value="">All Categories</option>' +
      categories.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  } catch {
    // Silent fail — filter just won't have categories
  }
}

async function init() {
  const ok = await Auth.load();
  if (!ok || !Auth.requireAuth(['provider'])) return;

  // Marketplace is a provider workspace per lifecycle requirements.
  const backBtn = document.getElementById('backBtn');
  const base = window.location.pathname.split('/frontend/')[0];
  backBtn.href = `${base}/frontend/pages/dashboard/provider.html`;
  Layout.renderNavbar('app-header', 'browse');

  // Event listeners
  document.getElementById('searchInput').addEventListener('input', debounceLoad);
  document.getElementById('searchBtn').addEventListener('click', loadRequests);
  document.getElementById('fCategory').addEventListener('change', loadRequests);
  document.getElementById('fLocation').addEventListener('change', loadRequests);
  document.getElementById('fSort').addEventListener('change', loadRequests);
  document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);

  await loadCategories();
  loadRequests();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
