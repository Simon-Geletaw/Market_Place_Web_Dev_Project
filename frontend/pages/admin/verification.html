<!DOCTYPE html>
<html lang="en" data-role="admin">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230066CC'/%3E%3Cpath d='M10 16L14.5 20.5L22 11' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Provider Verification — ServiceLink Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <script src="../../core/guard.js"></script>
</head>
<body>
<header id="app-header"></header>
<div class="app-shell">
  <aside id="app-sidebar"></aside>
  <main class="app-content">
    <div class="page-header">
      <div>
        <div class="page-header__title">Provider Verification</div>
        <div class="page-header__subtitle">Review and approve provider applications</div>
      </div>
      <select class="form-select" id="filterVerified" style="width:auto">
        <option value="pending">Pending Only</option>
        <option value="all">All Providers</option>
        <option value="verified">Verified Only</option>
      </select>
    </div>
    <div id="list"></div>
  </main>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" style="max-width:560px" role="dialog" aria-modal="true" aria-labelledby="modalTitleVerification">
    <div class="modal__header">
      <h2 class="modal__title" id="modalTitleVerification">Provider Details</h2>
      <button class="modal__close" id="closeModalBtn" aria-label="Close modal">✕</button>
    </div>
    <div class="modal__body" id="detailContent"></div>
    <div class="modal__footer" id="detailActions"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
import Api    from '../../core/api.js';
import Auth   from '../../core/auth.js';
import Toast  from '../../core/toast.js';
import Layout from '../../core/layout.js';

function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

let allProviders = [];

async function load() {
  const filter = document.getElementById('filterVerified').value;
  const el = document.getElementById('list');
  el.innerHTML = '<div class="empty-state"><div class="spinner spinner--dark"></div><p>Loading providers...</p></div>';
  try {
    const res = await Api.get('/admin/providers');
    allProviders = res.data || [];

    let filtered = allProviders;
    if (filter === 'pending')  filtered = allProviders.filter(p => !p.is_verified);
    if (filter === 'verified') filtered = allProviders.filter(p =>  p.is_verified);

    if (!filtered.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-state__icon">🔍</div><p class="empty-state__text">No providers found for the selected filter.</p></div>`;
      return;
    }

    el.innerHTML = `<div class="table-wrapper"><table class="data-table">
      <thead><tr><th>Name</th><th>Email</th><th>Location</th><th>Rating</th><th>Joined</th><th>Status</th><th></th></tr></thead>
      <tbody>
      ${filtered.map(p => `<tr>
        <td><strong>${esc(p.name)}</strong></td>
        <td>${esc(p.email)}</td>
        <td>${esc(p.location || '—')}</td>
        <td>${p.rating_average > 0 ? parseFloat(p.rating_average).toFixed(1)+' ⭐ ('+p.total_reviews+')' : 'New'}</td>
        <td class="text-sm text-muted">${p.created_at ? new Date(p.created_at).toLocaleDateString() : '—'}</td>
        <td><span class="badge ${p.is_verified ? 'badge--assigned' : 'badge--requested'}">${p.is_verified ? 'Verified' : 'Pending'}</span></td>
        <td>
          <button class="btn btn--ghost btn--sm" onclick="openDetail('${p.id}')">View</button>
          ${!p.is_verified ? `<button class="btn btn--success btn--sm" onclick="verifyProvider('${p.id}', this)">✓ Verify</button>` : ''}
        </td>
      </tr>`).join('')}
      </tbody></table></div>`;
  } catch (err) {
    el.innerHTML = `<div class="empty-state"><p class="text-muted">${esc(err.message || 'Could not load providers.')}</p></div>`;
  }
}

window.openDetail = function(id) {
  const p = allProviders.find(x => x.id === id);
  if (!p) return;
  document.getElementById('detailContent').innerHTML = `
    <div class="info-grid">
      <div class="info-row"><span class="info-row__label">Name</span><span class="info-row__val">${esc(p.name)}</span></div>
      <div class="info-row"><span class="info-row__label">Email</span><span class="info-row__val">${esc(p.email)}</span></div>
      <div class="info-row"><span class="info-row__label">Phone</span><span class="info-row__val">${esc(p.phone || '—')}</span></div>
      <div class="info-row"><span class="info-row__label">Location</span><span class="info-row__val">${esc(p.location || '—')}</span></div>
      <div class="info-row"><span class="info-row__label">Rating</span><span class="info-row__val">${p.rating_average > 0 ? parseFloat(p.rating_average).toFixed(1)+' ⭐ from '+p.total_reviews+' reviews' : 'No reviews yet'}</span></div>
      <div class="info-row"><span class="info-row__label">Status</span><span class="info-row__val"><span class="badge ${p.is_verified ? 'badge--assigned' : 'badge--requested'}">${p.is_verified ? 'Verified' : 'Pending'}</span></span></div>
      <div class="info-row"><span class="info-row__label">Joined</span><span class="info-row__val">${p.created_at ? new Date(p.created_at).toLocaleString() : '—'}</span></div>
    </div>`;
  document.getElementById('detailActions').innerHTML = `
    <button class="btn btn--secondary" id="closeModalFooterBtn">Close</button>
    ${!p.is_verified ? `<button class="btn btn--success" onclick="verifyProvider('${p.id}', this); document.getElementById('detailModal').classList.remove('open'); load();">✓ Approve Provider</button>` : '<span class="text-muted">Provider is already verified.</span>'}`;
  document.getElementById('detailModal').classList.add('open');
  document.getElementById('closeModalFooterBtn').onclick = () => document.getElementById('detailModal').classList.remove('open');
};

window.verifyProvider = async function(id, btn) {
  if (!confirm('Verify this provider?')) return;
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Verifying...';
  try {
    await Api.patch(`/admin/providers/${id}/verify`);
    Toast.success('Provider verified successfully!');
    load();
  } catch (err) {
    Toast.error(err.message || 'Failed to verify.');
    btn.disabled = false; btn.textContent = orig;
  }
};

async function init() {
  const ok = await Auth.load();
  if (!ok || !Auth.requireAuth(['admin'])) return;
  Layout.renderShell('admin', 'verification', 'admin');
  document.getElementById('filterVerified').addEventListener('change', load);
  document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('detailModal').classList.remove('open'));
  load();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
