<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Audit Logs — ServiceLink Admin</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<header class="app-navbar">
  <div class="navbar">
    <a href="../../landing_page/index.html" class="navbar__logo"><div class="navbar__logo-icon">S</div>Service<span class="navbar__logo-accent">Link</span> <span class="badge badge--verified" style="font-size:10px;margin-left:4px">Admin</span></a>
    <div class="navbar__actions"><div class="navbar__user" id="navUser"></div><button class="btn btn--secondary btn--sm" onclick="Auth.logout()">Logout</button></div>
  </div>
</header>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="sidebar">
      <div class="sidebar__label">Admin Panel</div>
      <a href="../dashboard/admin.html" class="sidebar__item">📊 Overview</a>
      <a href="verification.html" class="sidebar__item">🔒 Verification</a>
      <a href="audit-logs.html" class="sidebar__item active">📋 Audit Logs</a>
      <a href="metrics.html" class="sidebar__item">📈 Metrics</a>
      <div class="sidebar__footer"><button class="btn btn--secondary btn--sm btn--full" onclick="Auth.logout()">Sign Out</button></div>
    </div>
  </aside>
  <main class="app-content">
    <div class="page-header">
      <div><div class="page-header__title">Audit Logs</div><div class="page-header__subtitle">System activity trail for all users</div></div>
      <button class="btn btn--secondary btn--sm" onclick="load()">Refresh</button>
    </div>
    <div class="filter-bar">
      <input class="form-input" id="searchLog" placeholder="Search by action or user..." oninput="debounce()">
      <select class="form-select" id="limitLog" onchange="load()">
        <option value="50">50 rows</option><option value="100">100 rows</option><option value="200">200 rows</option>
      </select>
    </div>
    <div id="list"></div>
  </main>
</div>
<script src="../../assets/js/modules/api.js"></script>
<script src="../../assets/js/modules/auth.js"></script>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
let timer;
async function init(){await Auth.load();if(!Auth.requireRole('admin'))return;Auth.renderNavUser(document.getElementById('navUser'));load();}
function debounce(){clearTimeout(timer);timer=setTimeout(load,400);}
async function load(){
  const q=document.getElementById('searchLog').value;
  const lim=document.getElementById('limitLog').value;
  const el=document.getElementById('list');el.innerHTML='<div class="empty-state"><div class="spinner spinner--dark"></div></div>';
  try{
    const res=await api.get(`/admin/audit-logs?limit=${lim}&search=${encodeURIComponent(q)}`);const logs=res.data||[];
    if(!logs.length){el.innerHTML='<div class="empty-state"><div class="empty-state__icon">📋</div><div class="empty-state__title">No logs found</div></div>';return;}
    el.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Action</th><th>User</th><th>Role</th><th>Details</th><th>Time</th></tr></thead><tbody>
      ${logs.map(l=>`<tr>
        <td><strong>${esc(l.action)}</strong></td>
        <td>${esc(l.user_name||'System')}</td>
        <td><span class="badge badge--${l.user_role==='admin'?'verified':l.user_role==='provider'?'accepted':'pending'}">${esc(l.user_role||'—')}</span></td>
        <td class="text-sm text-muted">${esc(l.details||'—')}</td>
        <td class="text-sm text-muted" style="white-space:nowrap">${new Date(l.created_at).toLocaleString()}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
  }catch{el.innerHTML='<div class="empty-state"><p class="text-muted">Could not load logs.</p></div>';}
}
init();
</script>
</body>
</html>
