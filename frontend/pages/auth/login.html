<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body class="auth-shell">

  <!-- Navbar -->
  <header class="app-navbar">
    <div class="navbar">
      <a href="../../landing_page/index.html" class="navbar__logo">
        <div class="navbar__logo-icon">S</div>
        Service<span class="navbar__logo-accent">Link</span>
      </a>
      <div class="navbar__actions">
        <a href="register.html" class="btn btn--ghost btn--sm">Sign Up</a>
      </div>
    </div>
  </header>

  <div class="auth-content">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:var(--space-xl)">
        <h1 style="font-size:24px;margin-bottom:4px">Welcome back</h1>
        <p class="text-muted">Sign in to your ServiceLink account</p>
      </div>

      <!-- Error banner -->
      <div id="errorBanner" class="toast toast--error" style="display:none;margin-bottom:var(--space-md);position:relative;animation:none"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="input-group__icon pw-toggle" id="pwToggle" aria-label="Show password">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div style="text-align:right;margin-top:4px">
            <a href="forgot-password.html" class="text-sm" style="color:var(--color-primary)">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Sign In</button>
      </form>

      <hr class="divider">
      <p style="text-align:center;font-size:13px">
        Don't have an account? <a href="register.html">Sign up free</a>
      </p>
    </div>
  </div>

  <script type="module">
    import Api from '../../core/api.js';
    import Auth from '../../core/auth.js';
    
    // A simple validation implementation inline since validate.js is not an ES module yet
    const Validate = {
      required: (v) => !!v.trim(),
      email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
      field: (el, isValid, errMsg) => {
        const fg = el.closest('.form-group');
        let err = fg.querySelector('.form-error');
        if (!isValid) {
          el.classList.add('error');
          if (!err) { err = document.createElement('div'); err.className = 'form-error'; fg.appendChild(err); }
          err.textContent = errMsg;
        } else {
          el.classList.remove('error');
          if (err) err.remove();
        }
        return isValid;
      }
    };

    // Toggle password visibility
    document.getElementById('pwToggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    // Form submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const btn = document.getElementById('submitBtn');
      const banner = document.getElementById('errorBanner');
      banner.style.display = 'none';

      let valid = true;
      if (!Validate.field(email, Validate.email(email.value), 'Enter a valid email address')) valid = false;
      if (!Validate.field(password, Validate.required(password.value), 'Password is required')) valid = false;
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';
      try {
        const res = await Api.post('/auth/login', { email: email.value, password: password.value });
        if (res.token) {
           Auth.setToken(res.token);
           Auth.setUser(res.user);
        }
        const role = String(res.user?.role || '').toLowerCase();
        const map = { customer: '../dashboard/customer.html', provider: '../dashboard/provider.html', admin: '../dashboard/admin.html' };
        window.location.href = map[role] || '../dashboard/customer.html';
      } catch (err) {
        banner.textContent = err.message || 'Invalid credentials. Please try again.';
        banner.style.display = 'flex';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
