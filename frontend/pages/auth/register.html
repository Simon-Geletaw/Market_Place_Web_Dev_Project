<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Register — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body class="auth-shell">

  <header class="app-navbar">
    <div class="navbar">
      <a href="../../landing_page/index.html" class="navbar__logo">
        <div class="navbar__logo-icon">S</div>
        Service<span class="navbar__logo-accent">Link</span>
      </a>
      <div class="navbar__actions">
        <a href="login.html" class="btn btn--ghost btn--sm">Sign In</a>
      </div>
    </div>
  </header>

  <div class="auth-content" style="padding-top:80px">
    <div class="auth-card" style="max-width:520px">
      <div style="text-align:center;margin-bottom:var(--space-xl)">
        <h1 style="font-size:24px;margin-bottom:4px">Create an account</h1>
        <p class="text-muted">Join ServiceLink and get started today</p>
      </div>

      <div id="errorBanner" class="toast toast--error" style="display:none;margin-bottom:var(--space-md);position:relative;animation:none"></div>

      <form id="registerForm" novalidate>

        <!-- Role -->
        <div class="form-group">
          <label class="form-label">I am a...</label>
          <div class="role-selector">
            <div class="role-option">
              <input type="radio" name="role" id="roleCustomer" value="customer" checked>
              <label class="role-option__label" for="roleCustomer">
                <div class="role-option__icon">🏠</div>
                <div style="font-weight:600;font-size:14px">Customer</div>
                <div class="text-sm text-muted">Post service requests</div>
              </label>
            </div>
            <div class="role-option">
              <input type="radio" name="role" id="roleProvider" value="provider">
              <label class="role-option__label" for="roleProvider">
                <div class="role-option__icon">🔧</div>
                <div style="font-weight:600;font-size:14px">Provider</div>
                <div class="text-sm text-muted">Offer your services</div>
              </label>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name</label>
            <input class="form-input" type="text" id="fullName" placeholder="Ahmed Hassan" autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input class="form-input" type="tel" id="phone" placeholder="+251 911 234 567" autocomplete="tel">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input class="form-input" type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password">
            <button type="button" class="input-group__icon pw-toggle" id="pwToggle" aria-label="Show password">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="pw-strength"><div class="pw-strength__bar" id="pwBar"></div></div>
          <div class="form-hint" id="pwHint">Min 8 chars, 1 uppercase, 1 number</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="location">Location (Sub-city)</label>
          <select class="form-select" id="location">
            <option value="">Select your sub-city...</option>
            <option>Bole</option><option>Kirkos</option><option>Addis Ketema</option>
            <option>Akaki Kaliti</option><option>Arada</option><option>Gullele</option>
            <option>Kolfe Keranio</option><option>Lideta</option><option>Nifas Silk-Lafto</option>
            <option>Yeka</option><option>Lemi Kura</option>
          </select>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Create Account</button>
      </form>

      <hr class="divider">
      <p style="text-align:center;font-size:13px">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="../../assets/js/modules/api.js"></script>
  <script src="../../assets/js/modules/toast.js"></script>
  <script src="../../assets/js/modules/validate.js"></script>
  <script>
    document.getElementById('pwToggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('password').addEventListener('input', function() {
      const s = Validate.passwordStrength(this.value);
      const bar = document.getElementById('pwBar');
      bar.className = 'pw-strength__bar ' + (this.value ? s : '');
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('fullName');
      const email    = document.getElementById('email');
      const password = document.getElementById('password');
      const phone    = document.getElementById('phone');
      const location = document.getElementById('location');
      const role     = document.querySelector('input[name="role"]:checked').value;
      const btn      = document.getElementById('submitBtn');
      const banner   = document.getElementById('errorBanner');
      banner.style.display = 'none';

      let valid = true;
      if (!Validate.field(full_name, Validate.minLen(full_name.value, 2), 'Full name required (min 2 chars)')) valid = false;
      if (!Validate.field(email, Validate.email(email.value), 'Enter a valid email address')) valid = false;
      if (!Validate.field(password, Validate.minLen(password.value, 8), 'Password must be at least 8 characters')) valid = false;
      if (!Validate.field(location, Validate.required(location.value), 'Please select your location')) valid = false;
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account...';
      try {
        await api.post('/auth/register', { full_name: full_name.value, email: email.value, password: password.value, phone: phone.value, location: location.value, role });
        window.location.href = 'login.html?registered=1';
      } catch (err) {
        banner.textContent = err.message || 'Registration failed. Please try again.';
        banner.style.display = 'flex';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
