<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Forgot Password — ServiceLink</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body class="auth-shell">
  <header class="app-navbar">
    <div class="navbar">
      <a href="../../landing_page/index.html" class="navbar__logo">
        <div class="navbar__logo-icon">S</div>
        Service<span class="navbar__logo-accent">Link</span>
      </a>
    </div>
  </header>
  <div class="auth-content">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:var(--space-xl)">
        <div style="font-size:40px;margin-bottom:var(--space-sm)">🔑</div>
        <h1 style="font-size:22px;margin-bottom:4px">Reset your password</h1>
        <p class="text-muted">Enter your email and we'll send reset instructions.</p>
      </div>
      <div id="successMsg" class="toast toast--success" style="display:none;margin-bottom:var(--space-md);position:relative;animation:none"></div>
      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn--primary btn--full" id="submitBtn">Send Reset Link</button>
      </form>
      <hr class="divider">
      <p style="text-align:center;font-size:13px"><a href="login.html">← Back to login</a></p>
    </div>
  </div>
  <script src="../../assets/js/modules/api.js"></script>
  <script src="../../assets/js/modules/validate.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email');
      const btn = document.getElementById('submitBtn');
      if (!Validate.field(email, Validate.email(email.value), 'Enter a valid email')) return;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Sending...';
      try {
        await api.post('/auth/forgot-password', { email: email.value });
        document.getElementById('successMsg').textContent = 'If this email is registered, a reset link has been sent.';
        document.getElementById('successMsg').style.display = 'flex';
        document.getElementById('forgotForm').style.display = 'none';
      } catch {
        document.getElementById('successMsg').textContent = 'If this email is registered, a reset link has been sent.';
        document.getElementById('successMsg').style.display = 'flex';
        document.getElementById('forgotForm').style.display = 'none';
      }
    });
  </script>
</body>
</html>
